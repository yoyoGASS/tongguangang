/* ─── 出櫃順序：先扣櫃，再沒驗過的，都做完就隨機複驗 ────────── */
function pickQueue(subKey){
  const p = subKey? pool().filter(q=>q.subjectKey===subKey) : pool();
  const R = q => S.records[q.id];

  const held  = p.filter(q=>{const r=R(q); return r && r.correct===false;});
  const due   = p.filter(q=>{const r=R(q); return r && r.correct!==false && (r.due||0) <= Date.now();});
  const early = p.filter(q=>{const r=R(q); return r && r.correct!==false && (r.due||0) >  Date.now();});
  const fresh = p.filter(q=>!R(q));

  // 同一題在不同年份重出的版本，先只出最新那一版。連著出等於零間隔重複，
  // 那是研究裡明確無效的做法；其餘版本留到複習階段，自動獲得一個大間隔。
  const seen=new Set(), firstPass=[], deferred=[];
  for(const q of fresh.slice().sort((a,b)=>b.year-a.year)){
    if(q.cluster && seen.has(q.cluster)){ deferred.push(q); continue; }
    if(q.cluster) seen.add(q.cluster);
    firstPass.push(q);
  }
  const hot  = firstPass.filter(q=>q.clusterSize>=3);
  const warm = firstPass.filter(q=>q.clusterSize<3);

  const q = [
    ...interleave(shuffle(held), 2),                    // 扣櫃題：交錯
    ...interleave(shuffle(due),  2),                    // 到期複習：交錯
    ...shuffle(hot),                                    // 高頻新題排前面
    ...interleave(shuffle(warm), 5),                    // 新題：同科小段集中，先建立理解
    ...interleave(shuffle(deferred.concat(early)), 2)
  ];
  return q.length? q : shuffle(p);
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* 把佇列排成「同一科最多連續 maxRun 題」。
   新題用 5（同科小段集中，先建立理解），複習用 2（交錯，長期保留較好）。
   注意：真正的交錯效果來自「相似類別之間做辨別」，題庫目前沒有考點標籤，
   這裡只能做到科目層級的粗粒度控制，不要把它當成完整的交錯練習。 */
function interleave(list, maxRun){
  const bySub={};
  for(const q of list) (bySub[q.subjectKey] = bySub[q.subjectKey] || []).push(q);
  const out=[]; let last=null, run=0;
  while(out.length < list.length){
    const keys=Object.keys(bySub).filter(k=>bySub[k].length);
    if(!keys.length) break;
    keys.sort((a,b)=>bySub[b].length - bySub[a].length);
    const k = keys.find(x=>!(x===last && run>=maxRun)) || keys[0];
    if(k===last) run++; else { last=k; run=1; }
    out.push(bySub[k].shift());
  }
  return out;
}

/* ─── 抽驗定位：選題 ─────────────────────────────────────────
   40 題、每科 10 題，跑完給一張四科強弱的報告。
   報告會自己講出三個限制，不藏起來：
     ① 每科只有 10 題、四選一還有 25% 猜得中，兩科要差 5 題以上才算真的有強弱。
     ② 再往下切題型軸，每一格只剩兩三題，只能當線索不能當結論。
     ③ 答對不升格——可能是猜的，那題之後還會再出現一次。 */
const PLACE_PER = 10;
const QBY = new Map(MC.map(q=>[q.id, q]));
const RE_NUMOPT = /^[\d,.\s%％$]+$/;

/* 英文另建一條軸。TYPE_RULES 是照中文法規題寫的，對關務英文 320 題一題都不命中，
   全部落進「觀念題」——等於沒有分軸，報告就講不出英文弱在哪一種題。 */
function axisOf(q){
  if(q.subjectKey!=='english') return guideType(q).tag;
  const o=q.options.map(x=>String(x).trim());
  if(o.length===4 && o.every(x=>RE_NUMOPT.test(x))) return '數字判讀';
  if(o.length===4 && o.every(x=>ONEWORDW.test(x)))  return '詞義';
  if(q.stem.length>=120) return '長句閱讀';
  return '片語句型';
}

/* 每科的 10 題按題庫的題型佔比配額（最大餘數法），不是隨機抓。
   隨機抓的話，稅則有 62% 是歸列題，10 題裡可能一題歸列都沒抽到，
   報告就會漏掉這一科真正的主軸。 */
function placePick(){
  const per = SUBJECTS.map(s=>{
    let p = pool().filter(q=>q.subjectKey===s.key && q.accept && q.accept.length===1);

    // 同一個考點只取一題（留最新年份那一版）。同組重複出的題答案一樣，
    // 抽到兩題等於同一格資訊算兩次。
    const cl=new Set();
    p = p.slice().sort((a,b)=>b.year-a.year).filter(q=>{
      if(!q.cluster) return true;
      if(cl.has(q.cluster)) return false;
      cl.add(q.cluster); return true;
    });

    const bk={};
    p.forEach(q=>{ const a=axisOf(q); (bk[a]=bk[a]||[]).push(q); });
    // 軸內先洗牌，再把沒做過的排到前面（sort 是穩定的，所以組內仍是隨機）。
    // 做過的題會高估——你可能記得的是答案不是考點。
    Object.keys(bk).forEach(k=>{
      bk[k]=shuffle(bk[k]).sort((a,b)=>(S.records[a.id]?1:0)-(S.records[b.id]?1:0));
    });

    const names=Object.keys(bk).sort((a,b)=>bk[b].length-bk[a].length);
    const exact=names.map(n=>bk[n].length/p.length*PLACE_PER);
    const take=exact.map(v=>Math.floor(v));
    let left=PLACE_PER-take.reduce((a,b)=>a+b,0);
    const order=names.map((n,i)=>i).sort((a,b)=>(exact[b]%1)-(exact[a]%1));
    for(let k=0; left>0 && k<order.length*4; k++){
      const i=order[k%order.length];
      if(take[i] < bk[names[i]].length){ take[i]++; left--; }
    }
    const out=[];
    names.forEach((n,i)=>out.push(...bk[n].slice(0, take[i])));
    return out;
  });
  // 四科交錯出。整科連出的話，排在最後那一科會被疲勞拖低，
  // 那個差距會被誤讀成「這科比較弱」。
  return interleave(shuffle([].concat.apply([], per)), 2);
}

  const ok = q.accept.includes(picked);
  p.ans.push(picked);
  p.ms.push(Math.min(Date.now()-placeT0, 30*60000));   // 夾住：中途去吃飯不算作答時間

  // 答錯歸零進扣櫃；答對不升格——四選一有 25% 猜得中，這一題還要再驗一次。
  const rec=S.records[q.id]||{seen:0, box:0};
  const box = ok ? (rec.box||0) : 0;
  S.records[q.id]={choice:picked, correct:ok, seen:rec.seen+1, at:Date.now(),
                   ms:p.ms[p.ms.length-1], box, due:dueAt(box), from:'place'};
  rollDay(); touchStreak();
  S.dayCount++; if(ok) S.dayPass++; else S.dayHold++;

  p.i++; save();
  SFX.tap();
  if(p.i>=p.ids.length) return placeFinish();
  renderPlace();
}

function placeFinish(){
  const p=S.place;
  S.placeDone={at:Date.now(), ids:p.ids.slice(0,p.ans.length), ans:p.ans, ms:p.ms};
  S.place=null;
  if(S.boxPlaceAt!==S.placeDone.at){ S.boxPlaceAt=S.placeDone.at; grantBox('跑完一輪抽驗定位'); }
  const star=checkStars(); if(star) S.starPop=star.key;
  save();
  SFX.horn();
  viewPlaceReport();
}

/* ─── 抽驗定位：報告 ─────────────────────────────────────── */
function placeRows(){
  const d=S.placeDone; if(!d) return [];
  return d.ids.map((id,i)=>{
    const q=QBY.get(id); if(!q) return null;
    const pick=d.ans[i];
    return {q, pick, ms:d.ms[i]||0, ok:q.accept.includes(pick), axis:axisOf(q)};
  }).filter(Boolean);
}
function median(a){
  if(!a.length) return 0;
  const b=a.slice().sort((x,y)=>x-y), m=b.length>>1;
  return b.length%2 ? b[m] : (b[m-1]+b[m])/2;
}

function viewPlaceReport(){
  hush(); enter('place');
  const d=S.placeDone;
  if(!d) return viewPlaceIntro();
  const rows=placeRows();
  if(!rows.length) return viewPlaceIntro();

  const per=SUBJECTS.map(s=>{
    const l=rows.filter(r=>r.q.subjectKey===s.key);
    return {s, n:l.length, ok:l.filter(r=>r.ok).length, list:l};
  }).filter(x=>x.n);
  const scored=per.slice().sort((a,b)=>(b.ok/b.n)-(a.ok/a.n));
  const hi=scored[0], lo=scored[scored.length-1];
  // 兩科都是 n=10 才能直接比題數；萬一題庫不足就換算成同一個基準
  const gap = Math.round((hi.ok/hi.n - lo.ok/lo.n) * PLACE_PER);
  const solid = gap>=5;
  const totOk=rows.filter(r=>r.ok).length;
  const target=Math.round(rows.length*0.7);

  // 題型軸：每一格題數都很小，低於 3 題的不列——列了只會被當成結論
  const ax={};
  rows.forEach(r=>{
    const k=r.q.subjectKey+'|'+r.axis;
    (ax[k]=ax[k]||{key:r.q.subjectKey, axis:r.axis, n:0, ok:0});
    ax[k].n++; if(r.ok) ax[k].ok++;
  });
  const axList=Object.values(ax).filter(a=>a.n>=3)
    .sort((a,b)=>(a.ok/a.n)-(b.ok/b.n) || b.n-a.n);

  // 快錯／慢錯：用使用者自己的中位數當基準，不用絕對秒數
  const med=median(rows.map(r=>r.ms).filter(m=>m>0));
  const wrong=rows.filter(r=>!r.ok);
  const fast=wrong.filter(r=>r.ms>0 && r.ms < med*0.5).length;
  const slow=wrong.filter(r=>r.ms > med*1.5).length;
  const msOK = med>=4000 && rows.filter(r=>r.ms>0).length>=rows.length*0.8;

  // 陷阱族群與多欄位「只錯一半」
  const fam={}; let half=0, halfOK=0, halfTot=0;
  wrong.forEach(r=>{
    const acc=r.q.accept;
    if(acc.length!==1 || r.pick==null) return;
    const f=diagFull(r.q.options[r.pick], r.q.options[acc[0]], r.q);
    if(!f.tag) return;
    fam[f.tag]=(fam[f.tag]||0)+1;
    if(f.tag==='多欄位'){ half++; halfOK+=f.ok; halfTot+=f.fields; }
  });
  // 多欄位已經有自己的段落，不要在族群表再數一次
  const famList=Object.entries(fam).filter(x=>x[0]!=='多欄位' && x[1]>=2).sort((a,b)=>b[1]-a[1]);

  app().innerHTML=`
    <div class="cal-card settle">
      <div class="cal-h"><b>抽驗報告</b>
        <span class="d plate">${new Date(d.at).toLocaleDateString('zh-TW').replace(/\//g,'.')} · ${rows.length} 櫃</span></div>
      ${per.map(x=>`
        <div class="cal-bar" style="--sc:var(--${x.s.key}-lit)">
          <span class="nm">${x.s.short}</span>
          <span class="tr">
            <span class="fl" style="width:${x.ok/x.n*100}%"></span>
            <span class="tk" style="left:calc(70% - 1px)"></span>
          </span>
          <span class="vv">${x.ok}<span style="opacity:.4">/${x.n}</span></span>
        </div>`).join('')}
      <div class="cal-legend">直立刻度線是 <b class="plate">70%</b>。單選拿七成、申論拿一半就到及格的 60 分——
        這條線不是滿分線，是最低的安全線。</div>
      <div class="cal-note">整體 <em>${totOk}</em>／${rows.length}
        （${Math.round(totOk/rows.length*100)}%），七成的線在 <em>${target}</em> 題。
        ${totOk>=target ? '已經站在安全線上了，接下來是守住它。'
          : '離安全線還有 '+(target-totOk)+' 題。現在差得遠是正常的——這張報告的用途是告訴你先補哪裡，不是打分數。'}</div>
    </div>

    <div class="cal-verdict settle">
      <b>能不能下結論</b>
      ${solid
        ? `<em>${hi.s.name}</em>（${hi.ok}/${hi.n}）和 <em>${lo.s.name}</em>（${lo.ok}/${lo.n}）差了 ${gap} 題。
           每科 10 題的抽驗，差到 5 題以上就不太可能是運氣——這個強弱可以當真。<br>
           先把 <em>${lo.s.name}</em> 練起來。`
        : `最高的 <em>${hi.s.name}</em>（${hi.ok}/${hi.n}）和最低的 <em>${lo.s.name}</em>（${lo.ok}/${lo.n}）只差 ${gap} 題。<br>
           每科只有 10 題，四選一還有四分之一猜得中，差不到 5 題就落在抽樣誤差裡——
           <em>這次測不出四科誰強誰弱</em>。別因為這張報告偏廢任何一科，照高頻考點跟扣櫃練就好。`}
    </div>

    ${axList.length? `<div class="section-title plate">哪一種題型在漏分</div>
      <table class="cal-ax">
        <tr><th>船席 · 題型</th><th class="n">放行</th></tr>
        ${axList.map(a=>`<tr>
          <td style="--sc:var(--${a.key}-lit)"><i class="sw"></i>${SUB[a.key].short} · ${esc(a.axis)}</td>
          <td class="n">${a.ok}/${a.n}</td></tr>`).join('')}
      </table>
      <p class="cal-legend">四十題再切成題型，每一格只剩三到六題。這張表只能當<b>線索</b>——
        看到某一格是 0，值得回去翻那類題多做幾題確認，但別直接當成結論。
        少於 3 題的格子沒有列出來。</p>` : ''}

    ${(msOK && (fast||slow))? `<div class="section-title plate">錯的方式</div>
      <div class="cal-card">
        ${fast? `<div class="cal-note" style="border-top:none"><em>${fast} 題答很快卻答錯</em>
          （不到你自己中位數 ${(med/1000).toFixed(0)} 秒的一半）。
          這種錯多半不是不會，是沒把整句讀完就被熟悉的字勾走了——否定題跟只差一個字的選項最常這樣。</div>`:''}
        ${slow? `<div class="cal-note"><em>${slow} 題想很久還是錯</em>
          （超過中位數的一倍半）。這種是考點本身沒建立起來，硬想沒有用，要回去看知識卡跟法條原文。</div>`:''}
      </div>`:''}

    ${half? `<div class="section-title plate">只錯一半的題</div>
      <div class="cal-card"><div class="cal-note" style="border-top:none">
        有 <em>${half}</em> 題是多欄位題（一題要同時答對好幾格）。這幾題你總共答對了
        <em>${halfOK}</em>／${halfTot} 格——<em>不是全錯</em>。
        逐題檢討時只補錯掉的那一格就好，整題重背是浪費。</div></div>`:''}

    ${famList.length? `<div class="section-title plate">被同一種陷阱抓到幾次</div>
      <table class="cal-ax">
        ${famList.map(([t,n])=>`<tr><td>${esc(t)}</td><td class="n">${n} 次</td></tr>`).join('')}
      </table>
      <p class="cal-legend">只列出重複發生兩次以上的。判不出來的錯不會列進來——
        約有四分之三的錯誤是講不出明確歸因的，含糊的診斷比不講更糟。</p>`:''}

    <div class="cal-verdict settle" style="border-left-color:var(--ink-3)">
      <b>這輪紀錄怎麼算</b>
      答錯的 ${wrong.length} 只櫃已經扣在堆場等複驗。答對的 ${totOk} 只<em>沒有升格</em>——
      四選一有 25% 猜得中，那些題之後還會再出現一次，答對第二次才算數。
    </div>

    <div class="section-title plate">接下來</div>
    ${wrong.length? `<button class="row" id="review" style="${subVars('tariff')}">
      <span class="swatch" style="background:var(--c3)"></span>
      <span><span class="row-t">逐題檢討這 ${wrong.length} 只被扣的櫃</span>
        <span class="row-m">REVIEW · 四科一起，走完整的三段引導</span></span>
      <span class="row-x">→</span></button>`:''}
    <button class="row" id="redo" style="${subVars('english')}">
      <span class="swatch"></span>
      <span><span class="row-t">重新抽驗一輪</span>
        <span class="row-m">RETAKE · 會換一批題，這張報告會被覆蓋</span></span>
      <span class="row-x">→</span></button>`;

  const weak = solid ? lo.s.key : null;
  dock(`<button class="btn-ghost btn" id="back">回堆場</button>
        <button class="btn" id="go">${weak? '先練 '+SUB[weak].name : '開始今日驗櫃'}</button>`);
  $('#back').onclick=()=>{ SFX.tap(); viewYard(); };
  $('#go').onclick=()=>{ SFX.tap(); startDrill(pickQueue(weak||undefined)); };
  const rv=$('#review');
  if(rv) rv.onclick=()=>{ SFX.tap(); startDrill(wrong.map(r=>r.q)); };
  $('#redo').onclick=()=>{
    if(!confirm('重新抽驗會換一批題，目前這張報告會被覆蓋。要繼續嗎？')) return;
    SFX.tap(); placeStart(); renderPlace();
  };
  if(wide()) say('practice', solid
    ? `量出來了：<em>${lo.s.name}</em> 明顯落後其他三科，差距大到不是運氣。<br>先打那一科最划算。`
    : `四科差不多，這次分不出強弱——那不是壞消息，是這 ${rows.length} 題還不夠分辨。<br>照常練就好，扣櫃區那 ${wrong.length} 只我先幫你留著。`, 'idle');
}

/* ─── 畫面：驗櫃 ─────────────────────────────────────────── */
let Q=[], qi=0, picked=null, stage=0, combo=0, qStart=0;
function startDrill(queue){ Q=queue; qi=0; combo=0; renderQ(); }
function renderQ(){
  if(qi>=Q.length){ return viewYard(); }
  const q=Q[qi]; picked=null; stage=0; qStart=Date.now();
  const s=SUB[q.subjectKey];
  const rec=S.records[q.id];

  app().innerHTML=`
    <div class="bay" style="${subVars(q.subjectKey)}">
      <div class="gantry" aria-hidden="true">
        <span class="rail"></span><span class="leg l"></span><span class="leg r"></span>
        <span class="trolley"><span class="cable a"></span><span class="cable b"></span></span>
        <span class="spreader"></span>
      </div>
      <div class="crane">
        <div class="bay-plate plate">
          <span class="swatch"></span>
          <span class="bp-t">${q.year} · ${s.name}</span>
          ${q.clusterSize>1?`<span class="hotchip plate" title="這個考點在 ${q.clusterYears.join('、')} 年都考過">考過 ${q.clusterSize} 次</span>`:''}
          ${combo>=2?`<span class="combo pop">${combo} 連放行</span>`:''}
          <span class="lamps" aria-hidden="true"><i class="lamp" id="l1"></i><i class="lamp" id="l2"></i><i class="lamp" id="l3"></i></span>
          <span class="no plate">${q.id.toUpperCase()}</span>
        </div>
        <p class="stem">${markStem(q.stem)}</p>
        <ul class="opts" id="opts">
          ${q.options.map((o,i)=>`<li><button class="opt" data-i="${i}" aria-pressed="false">
            <span class="opt-mark">${'ABCD'[i]}</span><span>${esc(o)}</span></button></li>`).join('')}
        </ul>
        <p style="font-size:11.5px;color:var(--ink-3);margin:14px 0 0;letter-spacing:.08em" class="plate">
          ${esc(q.source.file)} · P.${q.source.page}${rec?` · 已驗 ${rec.seen} 次`:''}
        </p>
      </div>
    </div>`;

  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    picked=+b.dataset.i; SFX.tap();
    document.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed', x===b));
    $('#submit').disabled=false;
  });

  dock(`<button class="btn-ghost btn" id="quit">收工</button>
        <button class="btn" id="submit" disabled>確認申報</button>`);
  $('#quit').onclick=()=>{ SFX.tap(); viewManifest(); };
  $('#submit').onclick=submit;

  scrollTo(0,0); renderSide();
  const g=guideType(q);
  say(q.subjectKey, `這櫃是 <em>${g.tag}</em>。看完題幹再選，別急。`, 'idle');
}

/* 通道燈：三顆先掃一遍，再定在結果上 */
function lamp(which){
  const ids=['l1','l2','l3'];
  ids.forEach(id=>{ const e=$('#'+id); if(e){ e.removeAttribute('data-on'); e.classList.remove('sweep'); } });
  ids.forEach((id,k)=>setTimeout(()=>{ const e=$('#'+id); if(e) e.classList.add('sweep'); }, k*70));
  setTimeout(()=>{
    const e=$('#'+which);
    if(e) e.setAttribute('data-on', which==='l1'?'c1':which==='l2'?'c2':'c3');
  }, 240);
}
function stampSVG(main, sub){
  const dt=today().replace(/-/g,'.');
  return `<svg viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="55" fill="none" stroke="currentColor" stroke-width="4"/>
    <circle cx="60" cy="60" r="46" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <text x="60" y="40" text-anchor="middle" font-family="Archivo Narrow, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.4" fill="currentColor">TAIWAN CUSTOMS</text>
    <text x="60" y="74" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="27" font-weight="900" letter-spacing="2" fill="currentColor">${main}</text>
    <text x="60" y="89" text-anchor="middle" font-family="Archivo Narrow, sans-serif" font-size="9" font-weight="700" letter-spacing="1.8" fill="currentColor">${sub}</text>
    <text x="60" y="101" text-anchor="middle" font-family="Archivo Narrow, sans-serif" font-size="8" letter-spacing=".6" fill="currentColor">${dt}</text>
  </svg>`;
}
function stampIt(){
  const bay=$('.bay'); if(!bay) return;
  const d=document.createElement('div');
  d.className='stamp';
  d.innerHTML=stampSVG('放行','CLEARED');
  bay.appendChild(d);
}
function xrayIt(){
  const bay=$('.bay'); if(!bay) return;
  const d=document.createElement('div');
  d.className='xray';
  d.style.setProperty('--scanTo', bay.getBoundingClientRect().height+'px');
  bay.appendChild(d);
  setTimeout(()=>d.remove(), 1100);
}

function submit(){
  const q=Q[qi];
  const acc = q.accept || [];       // 可接受答案（送分題會有多個）
  const correct = acc.length ? acc.includes(picked) : null;

  const rec=S.records[q.id]||{seen:0, box:0};
  // 被扣的櫃子重新答對——這是最該被獎勵的行為，盲盒只從這種地方發
  if(rec.correct===false && correct===true) boxOnRecover();
  // 間隔複習的格位：答對升一格、答錯歸零；沒有標準答案的題不動格位
  const box = correct===true  ? Math.min((rec.box||0)+1, BOX_DAYS.length-1)
            : correct===false ? 0
            : (rec.box||0);
  // ms：作答毫秒。答很快卻答錯跟想很久才答錯是兩種不同的錯，抽驗報告要分得出來
  S.records[q.id]={choice:picked, correct, seen:rec.seen+1, at:Date.now(),
                   ms:Math.min(Date.now()-qStart, 30*60000), box, due:dueAt(box)};
  rollDay(); touchStreak(); S.dayCount++;

  $('#opts').classList.add('locked');
  // 交卷後這顆按鈕已經不能按了（答錯時底欄還要 500ms 才換成引導），
  // 要真的標成 disabled——否則它長得像停用卻仍可聚焦、可按 Enter
  const sb=$('#submit'); if(sb) sb.disabled=true;
  const btns=[...document.querySelectorAll('.opt')];
  const beforeRank = rankOf(totalScore()).i;

  if(correct===true){
    S.dayPass++; combo++;
    lamp('l1'); stampIt();
    setTimeout(SFX.stamp, 90);
    acc.forEach(i=>{ if(btns[i]) btns[i].dataset.verdict='c1'; });
    // 送分題與舊法題都要講明白，不能讓使用者以為自己選的是唯一解
    const note = acc.length>1
      ? `<br>不過這題後來更正為<em>送分題</em>，${acc.map(i=>'ABCD'[i]).join('、')} 都算對。`
      : '';
    const promoted = rankOf(totalScore()).i > beforeRank;
    if(promoted){
      setTimeout(SFX.horn, 420);
      const rk=rankOf(totalScore()).cur;
      say(q.subjectKey, `C1 <em>免審免驗</em>，放行章蓋下去。<br>而且你升等了——現在是 <em>${rk.name}</em>。`+note, 'cheer');
    } else if(combo>=3){
      setTimeout(()=>SFX.combo(Math.min(combo,8)), 300);
      say(q.subjectKey, `C1 放行。這是第 <em>${combo}</em> 櫃連續放行，手感正熱。`+note, 'cheer');
    } else {
      say(q.subjectKey, 'C1 <em>免審免驗</em>，直接放行。這櫃過了。'+note, 'happy');
    }
    nextBtn('下一櫃'); scrollToBubble();
  } else if(correct===false){
    S.dayHold++; combo=0;
    lamp('l3'); xrayIt(); SFX.scan();
    setTimeout(SFX.hold, 420);
    btns[picked].dataset.verdict='c3';
    stage=1;
    setTimeout(()=>guideStage(q), 500);
    scrollToBubble();
  } else {
    S.dayPend++; combo=0;
    lamp('l2'); SFX.clue();
    btns[picked].dataset.verdict='c2';
    say(q.subjectKey,
      `C2 <em>文件審核</em>——這櫃的標準答案還沒進海關系統，我先把你的選擇記下來了。<br>
       答案補上之後，這題會自動變成可判分。`, 'think');
    nextBtn('下一櫃'); scrollToBubble();
  }
  save();
  markYardClear();
  const star = checkStars();
  if(star){ S.starPop = star.key; save(); }
  renderSide();
}

/* 三段式引導：① 這題在考什麼 ② 線索卡＋知識卡 ③ 才揭曉 */
function guideStage(q){
  const g=guideType(q);
  if(stage===1){
    say(q.subjectKey, `${md(g.say)}
      <button class="hintbtn">${ICON.again}先別看答案，我再想一次</button>`, 'oops',
      ()=>{ SFX.tap(); stage=2; guideStage(q); });
    nextBtn('跳過這櫃'); scrollToBubble();
    return;
  }
  if(stage===2){
    const clues=guideClues(q), note=matchNote(q);
    say(q.subjectKey,
      (clues.length
        ? `線索卡來了——這題的出處就寫在題幹裡：<div class="clues">${clues.map(c=>`<span class="clue">${esc(c)}</span>`).join('')}</div>`
        : `題幹沒有直接寫出法源，那就回到<em>${SUB[q.subjectKey].name}</em>的考點本身想一遍。`)
      + (note? `<button class="hintbtn" data-act="note">${ICON.card}翻出「${esc(note.title)}」知識卡</button>` : '')
      + `<button class="hintbtn" data-act="reveal">${ICON.eye}還是不確定，揭曉吧</button>`, 'think',
      (act)=>{
        SFX.tap();
        if(act==='note'){ stage=2.5; guideStage(q); }
        else { stage=3; guideStage(q); }
      });
    SFX.clue();
    nextBtn('跳過這櫃'); scrollToBubble();
    return;
  }
  if(stage===2.5){
    const note=matchNote(q);
    say(q.subjectKey, `${noteHTML(note)}
      <button class="hintbtn" data-act="reveal">${ICON.eye}看完了，揭曉答案</button>`, 'think',
      ()=>{ SFX.tap(); stage=3; guideStage(q); });
    nextBtn('跳過這櫃'); scrollToBubble();
    return;
  }
  const acc=q.accept||[];
  const opts=[...document.querySelectorAll('.opt')];
  acc.forEach(i=>{ if(opts[i]) opts[i].dataset.verdict='c1'; });
  const letters=acc.map(i=>'ABCD'[i]).join('、');
  // 陷阱診斷：只有單解、且選項文字判得出差異時才講；判不出來寧可不講
  const tip = (acc.length===1 && picked!=null && q.options[picked] && q.options[acc[0]])
    ? diagnose(q.options[picked], q.options[acc[0]], q) : '';
  say(q.subjectKey,
    (acc.length>1
      ? `這題後來<em>更正為送分</em>，${letters} 都算對。你原本的選擇不一定錯。`
      : `正解是 <em>${letters}</em>。`)
    + (tip? '<br>'+tip : '')
    + (q.explanation? '<br>'+esc(q.explanation) : '')
    + '<br>這櫃我先扣在堆場，下次還會再推出來給你驗。', 'idle');
  nextBtn('下一櫃'); scrollToBubble();
}

/* ─── 搪膠公仔盲盒 ───────────────────────────────────────────
   四科 × 5 款＝20 款。四款常規隨機抽，第五款是隱藏款。

   **盲盒只從「對學習有益的行為」發**，這條是硬規定：
     每日配額達標、連續靠港每 7 天、複驗放行 20 只扣櫃、跑完一輪抽驗定位。
   刻意不發給「答題數」與「連對數」——那兩個會獎勵猜答案和跳過三段引導，
   等於用獎勵把使用者推去做對學習最沒用的事。

   **隱藏款不靠運氣，靠成就解鎖。** 盲盒的變動比率獎勵已經夠黏了，
   再把最稀有的東西綁在機率上，只會讓人反覆開盒而不是回去讀書。 */
const FIG_V = [
  {n:'標準塗裝', d:'出廠的樣子。'},
  {n:'反光背心', d:'碼頭作業標配，夜裡看得見。'},
  {n:'夜班版',   d:'頭燈款。場燈熄了還在驗櫃的那種。'},
  {n:'放行章',   d:'手上那顆章，蓋下去就過了。'},
  {n:'金標特別版', d:'隱藏款。不靠運氣，只能靠做到。', star:true}
];
/* 隱藏款的條件：每一款都綁在該科真正的進度上 */
const FIG_STAR = {
  practice:{t:'把扣櫃區清空一次', ok:()=>S.clearedYard===true},
  law:     {t:'連續靠港 30 天',   ok:()=>(S.best||0)>=30},
  tariff:  {t:'稅則概要放行 200 櫃', ok:()=>statOf('tariff').pass>=200},
  english: {t:'抽驗定位英文 ≥ 8/10', ok:()=>{
    const rs=placeRows().filter(r=>r.q.subjectKey==='english');
    return rs.length>=8 && rs.filter(r=>r.ok).length>=8;
  }}
};
/* 公仔身上掛配件用的錨點：每隻的頭與身體在 viewBox 裡的位置都不一樣 */
const FIG_ANCHOR = {
  practice:{head:[50,41], body:[50,84], hand:[80,90]},
  law:     {head:[50,40], body:[50,62], hand:[87,78]},
  tariff:  {head:[45,42], body:[45,79], hand:[19,86]},
  english: {head:[50,36], body:[50,66], hand:[84,78]}
};
const figKey = (k,v)=>k+'-'+v;
const figOwned = (k,v)=>(S.figs||{})[figKey(k,v)]>0;
const figCount = ()=>Object.values(S.figs||{}).filter(n=>n>0).length;

/* 公仔＝夥伴本體＋配件。配件一律用 on 色（挖空色），
   才會像同一塊模具射出來的，而不是貼上去的。 */
function figureSVG(k, v, ctx){
  const gold = FIG_V[v].star;
  const [c,on] = gold
    ? [`var(--gold-lit)`, `var(--yard)`]
    : ctx==='onLivery' ? [`var(--${k}-on)`, `var(--${k})`]
                       : [`var(--${k}-lit)`, `var(--yard)`];
  let svg = MASCOTS[k].svg(c, on);
  const A = FIG_ANCHOR[k], [hx,hy]=A.head, [bx,by]=A.body, [ax,ay]=A.hand;
  let extra = '';
  if(v===1){                                        // 反光背心
    extra = `<g opacity=".92">
      <path d="M${bx-13} ${by-9}h26v17a13 13 0 0 1-26 0z" fill="${on}" opacity=".55"/>
      <path d="M${bx-13} ${by-3}h26M${bx-13} ${by+4}h26" stroke="${c}" stroke-width="2.4" opacity=".8"/>
    </g>`;
  } else if(v===2){                                 // 夜班版：頭燈
    extra = `<g>
      <path d="M${hx-19} ${hy-9}a19 19 0 0 1 38 0" stroke="${on}" stroke-width="5"
            fill="none" opacity=".85"/>
      <circle cx="${hx}" cy="${hy-13}" r="6" fill="${on}"/>
      <circle cx="${hx}" cy="${hy-13}" r="2.6" fill="${c}"/>
    </g>`;
  } else if(v===3){                                 // 放行章：手上拿著的章
    extra = `<g>
      <ellipse cx="${ax}" cy="${ay-22}" rx="5" ry="3.4" fill="${c}"/>
      <rect x="${ax-2.6}" y="${ay-22}" width="5.2" height="12" rx="2.4" fill="${c}"/>
      <rect x="${ax-9}" y="${ay-11}" width="18" height="8" rx="2.4" fill="${c}"/>
      <path d="M${ax-6} ${ay-7.5}h12" stroke="${on}" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>
    </g>`;
  } else if(gold){                                  // 金標：胸前掛牌
    extra = `<g>
      <rect x="${bx-9}" y="${by-6}" width="18" height="12" rx="2" fill="${on}" opacity=".9"/>
      <path d="M${bx} ${by-4}l1.6 3.4 3.7.5-2.7 2.6.7 3.7-3.3-1.8-3.3 1.8.7-3.7-2.7-2.6 3.7-.5z" fill="${c}"/>
    </g>`;
  }
  return extra ? svg.replace('</svg>', extra+'</svg>') : svg;
}
/* 還沒抽到的：只給剪影，看得出是哪一隻但看不出細節 */

function grantBox(why){
  S.boxes = (S.boxes||0) + 1;
  (S.boxWhy = S.boxWhy || []).push(why);
  if(S.boxWhy.length > 20) S.boxWhy = S.boxWhy.slice(-20);
  save();
}
/* 每日配額達標 —— 一天只發一次 */
function boxOnQuota(){ if(S.boxQuotaDay!==S.day){ S.boxQuotaDay=S.day; grantBox('今日配額達標'); } }
/* 連續靠港每 7 天 */
function boxOnStreak(){
  const step = Math.floor((S.streak||0)/7);
  if(step>0 && step!==(S.boxStreakStep||0)){ S.boxStreakStep=step; grantBox('連續靠港 '+(step*7)+' 天'); }
}
/* 複驗放行：被扣的櫃子重新答對 20 只發一盒。這是最該獎勵的行為 */
function boxOnRecover(){
  S.recover = (S.recover||0) + 1;
  if(S.recover % 20 === 0) grantBox('複驗放行 '+S.recover+' 只扣櫃');
}
/* 隱藏款：條件達成就直接給，不進盲盒池 */
function checkStars(){
  let got=null;
  SUBJECTS.forEach(s=>{
    if(figOwned(s.key,4)) return;
    let ok=false; try{ ok=FIG_STAR[s.key].ok(); }catch(e){ ok=false; }
    if(ok){ S.figs=S.figs||{}; S.figs[figKey(s.key,4)]=1; got=s; }
  });
  if(got){ save(); return got; }
  return null;
}
/* 扣櫃清空要記一筆——清空後又答錯會再有扣櫃，但「曾經清空過」不該被抹掉 */
function markYardClear(){
  if(!S.clearedYard && Object.keys(S.records).length>=40 && heldQuestions().length===0){
    S.clearedYard = true; save();
  }
}

/* ─── 開盒 ───────────────────────────────────────────────── */
function drawFigure(){
  // 只抽常規款（0–3）。四科等機率，款式等機率。
  const pool=[];
  SUBJECTS.forEach(s=>{ for(let v=0;v<4;v++) pool.push([s.key,v]); });
  const [k,v] = pool[Math.floor(Math.random()*pool.length)];
  S.figs = S.figs || {};
  const key = figKey(k,v);
  const dup = (S.figs[key]||0) > 0;
  S.figs[key] = (S.figs[key]||0) + 1;
  if(dup) S.goo = (S.goo||0) + 1;      // 重複的化成膠料，不讓它變成純粹的失望
  S.boxes = Math.max(0, (S.boxes||0) - 1);
  save();
  return {k, v, dup};
}

function revealFigure(got){

  app().innerHTML = `

/* ─── 去背與外框 ─────────────────────────────────────────────
   截圖是矩形、帶著原本的背景，直接壓在塗裝色場上一定突兀。
   從四個邊往內做漫延填色，把跟邊緣同色的區域挖掉，再把邊緣柔化一格，
   剪影才不會像用剪刀剪的。背景很雜（草地、房間）時挖不乾淨，
   那就靠圓框把它收成一個一致的形狀——所以兩個開關都留給使用者。 */
const CUT_TOL = {0:0, 1:34, 2:62, 3:96};      // 關／弱／中／強

function cutBG(cv, level){
  if(!level) return false;
  const tol = CUT_TOL[level] * CUT_TOL[level];
  const ctx = cv.getContext('2d', {willReadFrequently:true});
  const W = cv.width, H = cv.height;
  const im = ctx.getImageData(0,0,W,H), d = im.data;

  // 背景色取四邊的中位數，比取單一角落穩——角落剛好壓到主體就全毀了
  const rs=[], gs=[], bs=[];
  const sample=(x,y)=>{ const i=(y*W+x)*4; rs.push(d[i]); gs.push(d[i+1]); bs.push(d[i+2]); };
  for(let x=0;x<W;x+=Math.max(1,W>>6)){ sample(x,0); sample(x,H-1); }
  for(let y=0;y<H;y+=Math.max(1,H>>6)){ sample(0,y); sample(W-1,y); }
  const mid = a => a.sort((p,q)=>p-q)[a.length>>1];
  const br = mid(rs), bg = mid(gs), bb = mid(bs);

  // 從所有邊緣像素往內漫延。只挖「跟背景連通」的部分，
  // 主體內部剛好同色的區塊不會被穿孔。
  const seen = new Uint8Array(W*H);
  const stack = [];
  for(let x=0;x<W;x++){ stack.push(x, (H-1)*W+x); }
  for(let y=0;y<H;y++){ stack.push(y*W, y*W+W-1); }
  const near = i => {
    const dr=d[i*4]-br, dg=d[i*4+1]-bg, db=d[i*4+2]-bb;
    return dr*dr+dg*dg+db*db <= tol;
  };
  while(stack.length){
    const i = stack.pop();
    if(seen[i]) continue;
    if(!near(i)) continue;
    seen[i] = 1;
    const x = i % W, y = (i / W) | 0;
    if(x > 0)   stack.push(i-1);
    if(x < W-1) stack.push(i+1);
    if(y > 0)   stack.push(i-W);
    if(y < H-1) stack.push(i+W);
  }
  for(let i=0;i<W*H;i++) if(seen[i]) d[i*4+3] = 0;

  // 柔邊：留著的像素若鄰居有被挖掉的，alpha 依比例降下來
  const a0 = new Uint8Array(W*H);
  for(let i=0;i<W*H;i++) a0[i] = d[i*4+3];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i = y*W+x;
    if(!a0[i]) continue;
    let empty=0, n=0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      const xx=x+dx, yy=y+dy;
      if(xx<0||yy<0||xx>=W||yy>=H) continue;
      n++; if(!a0[yy*W+xx]) empty++;
    }
    if(empty) d[i*4+3] = Math.round(a0[i] * (1 - empty/n*0.9));
  }
  ctx.putImageData(im, 0, 0);
  return true;
}
/* 圓框：把方形收成圓形，背景挖不乾淨時至少形狀是一致的 */
function roundMask(cv){
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.globalCompositeOperation = 'destination-in';
  ctx.beginPath();
  ctx.arc(W/2, H/2, Math.min(W,H)/2, 0, Math.PI*2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}
/* 有沒有透明像素——有的話色場上就不必再墊底盤 */
function hasAlpha(cv){
  const d = cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,cv.width,cv.height).data;
  for(let i=3;i<d.length;i+=4) if(d[i] < 250) return true;
  return false;
}

/* ─── 裁切 ───────────────────────────────────────────────────
   一張合照要當四隻夥伴，得先各自框出來。貼上或選檔之後先進這裡，
   拖框選一隻，確定才存。同一張圖可以重複貼四次、各框一隻。 */
let CROP = null;   // {key, src, nw, nh, x, y, size}  x/y/size 都以顯示座標計

function startCrop(key, src){
  const im = new Image();
  im.onerror = ()=>alert('這張圖打不開。');
  im.onload = ()=>{
    CROP = {key, src, imgEl:im, nw:im.width, nh:im.height, x:0, y:0, size:0, cut:2, round:true};
    viewCrop();
  };
  im.src = src;
}
function viewCrop(){
  if(!CROP) return viewSettings();
  hush(); VIEW='settings'; renderRail(); renderSide();
  const s = SUB[CROP.key];
  app().innerHTML = `
    <div class="section-title plate">裁切 · ${s.name}</div>
    <p class="cal-legend">拖動方框選一隻，右下角的圓點調大小，點空白處框會跳過去。</p>
    <div class="crop-wrap" id="cropwrap">
      <img id="cropimg" src="${CROP.src}" alt="">
      <div class="crop-shade" id="cropshade"></div>
      <div class="crop-box" id="cropbox"><span class="crop-h" id="crophandle"></span></div>
    </div>

    <div class="crop-opt">
      <span class="lab">去背</span>
      <span class="seg" id="cutlv">${[['關',0],['弱',1],['中',2],['強',3]]
        .map(([l,v])=>`<button data-v="${v}" aria-pressed="${CROP.cut===v}">${l}</button>`).join('')}</span>
    </div>
    <div class="crop-opt">
      <span class="lab">外框</span>
      <span class="seg" id="cutshape">${[['方形',0],['圓形',1]]
        .map(([l,v])=>`<button data-v="${v}" aria-pressed="${(CROP.round?1:0)===v}">${l}</button>`).join('')}</span>
    </div>
    <p class="cal-legend">背景單純的話「中」通常就乾淨了；草地、房間這種雜背景挖不掉，
      那就用圓形把形狀收齊。挖過頭就往「弱」調。</p>

    <div class="section-title plate">貼上去長這樣</div>
    <div class="crop-prev" style="${subVars(CROP.key)}">
      <span class="pv pv-livery"><i id="pv1"></i><b>船席色場</b></span>
      <span class="pv pv-yard"><i id="pv2"></i><b>堆場地面</b></span>
    </div>`;
  dock(`<button class="btn-ghost btn" id="cancel">取消</button>
        <button class="btn-ghost btn" id="whole">最大範圍</button>
        <button class="btn" id="ok">用這一塊</button>`);
  $('#cancel').onclick=()=>{ SFX.tap(); CROP=null; viewSettings(); };
  $('#whole').onclick=()=>{ SFX.tap(); const img=$('#cropimg');
    CROP.size = Math.min(img.clientWidth, img.clientHeight);
    CROP.x = (img.clientWidth-CROP.size)/2; CROP.y = (img.clientHeight-CROP.size)/2;
    drawCrop(); preview(); };
  $('#ok').onclick=()=>{ SFX.tap(); commitCrop(); };
  $('#cutlv').onclick=e=>{ const b=e.target.closest('button'); if(!b)return;
    CROP.cut=+b.dataset.v; SFX.tap(); viewCrop(); };
  $('#cutshape').onclick=e=>{ const b=e.target.closest('button'); if(!b)return;
    CROP.round=!!+b.dataset.v; SFX.tap(); viewCrop(); };

  const img = $('#cropimg');
  const lay = ()=>{
    const w = img.clientWidth, h = img.clientHeight;
    if(!w || !h) return;
    if(!CROP.size){
      CROP.size = Math.min(w, h) * .7;
      CROP.x = (w - CROP.size)/2;
      CROP.y = (h - CROP.size)/2;
    }
    drawCrop(); preview();
  };
  if(img.complete) requestAnimationFrame(lay); else img.onload = lay;
  bindCrop();
}
/* 把目前的框＋去背＋外框做成一張圖。預覽用小尺寸跑，存檔才用 PIC_MAX。 */
function cropCanvas(size){
  const img = $('#cropimg');
  if(!img || !img.clientWidth) return null;
  const scale = CROP.nw / img.clientWidth;
  const sx = CROP.x*scale, sy = CROP.y*scale, sw = CROP.size*scale;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  // context 只會建立一次，之後 cutBG/hasAlpha 再要也拿到同一個——
  // 所以旗標要在這裡就設好，否則 Chrome 會一直警告 readback 慢
  cv.getContext('2d', {willReadFrequently:true}).drawImage(CROP.imgEl, sx, sy, sw, sw, 0, 0, size, size);
  cutBG(cv, CROP.cut);
  if(CROP.round) roundMask(cv);
  return cv;
}
let PV_T = null;
function preview(){
  clearTimeout(PV_T);
  PV_T = setTimeout(()=>{
    const cv = cropCanvas(128); if(!cv) return;
    let url; try{ url = cv.toDataURL('image/png'); }catch(e){ return; }
    const a=$('#pv1'), b=$('#pv2');
    if(a) a.style.backgroundImage = `url('${url}')`;
    if(b) b.style.backgroundImage = `url('${url}')`;
  }, 90);
}
function commitCrop(){
  if(!CROP) return;
  const cv = cropCanvas(PIC_MAX);
  if(!cv){ alert('裁切失敗，再試一次。'); return; }
  const clear = hasAlpha(cv);
  let out = null;
  // 有透明就一定要 png（webp 在部分瀏覽器會把 alpha 壓掉）
  if(!clear){ try{ const t = cv.toDataURL('image/webp', .85);
    if(t.indexOf('data:image/webp')===0) out = t; }catch(e){} }
  if(!out){ try{ out = cv.toDataURL('image/png'); }catch(e){ alert('這張圖轉不出來。'); return; } }
  const key = CROP.key;
  if(!setPic(key, out, clear)){
    alert('瀏覽器的儲存空間不夠，這張圖沒存進去。' + '你的作答紀錄沒有受影響。'
          + '先移除一兩張已放的圖，或換一張更小的。');
    return;
  }
  CROP = null; SFX.done();
  refreshPicColor(key).then(()=>{ applyPrefs(); viewSettings(); });
}

function drawCrop(){
  const box = $('#cropbox'), img = $('#cropimg'), shade = $('#cropshade');
  if(!box || !img) return;
  const w = img.clientWidth, h = img.clientHeight;
  CROP.size = Math.max(40, Math.min(CROP.size, Math.min(w, h)));
  CROP.x = Math.max(0, Math.min(CROP.x, w - CROP.size));
  CROP.y = Math.max(0, Math.min(CROP.y, h - CROP.size));
  box.style.cssText = `left:${CROP.x}px;top:${CROP.y}px;width:${CROP.size}px;height:${CROP.size}px`;
  // 用四邊的 box-shadow 把框外壓暗，比畫四塊遮罩省事
  if(shade) shade.style.cssText =
    `left:${CROP.x}px;top:${CROP.y}px;width:${CROP.size}px;height:${CROP.size}px`;
}
function bindCrop(){
  const wrap = $('#cropwrap'), box = $('#cropbox'), handle = $('#crophandle'), img = $('#cropimg');
  if(!wrap || !box) return;
  let mode = null, ox = 0, oy = 0, os = 0;
  const at = e => { const r = img.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  const down = (e, m) => {
    mode = m; const p = at(e); ox = p.x - CROP.x; oy = p.y - CROP.y; os = CROP.size;
    wrap.setPointerCapture(e.pointerId); e.preventDefault(); e.stopPropagation();
  };
  box.addEventListener('pointerdown', e=>down(e,'move'));
  handle.addEventListener('pointerdown', e=>down(e,'size'));
  wrap.addEventListener('pointerdown', e=>{
    if(e.target===box || e.target===handle) return;
    // 點空白處：把框移到點擊位置
    const p = at(e); CROP.x = p.x - CROP.size/2; CROP.y = p.y - CROP.size/2;
    drawCrop(); preview(); down(e,'move');
  });
  wrap.addEventListener('pointermove', e=>{
    if(!mode) return;
    const p = at(e);
    if(mode==='move'){ CROP.x = p.x - ox; CROP.y = p.y - oy; }
    else { CROP.size = Math.max(40, Math.max(p.x - CROP.x, p.y - CROP.y)); }
    drawCrop(); preview();
  });
  const up = ()=>{ mode = null; };
  wrap.addEventListener('pointerup', up);
  wrap.addEventListener('pointercancel', up);
  addEventListener('resize', ()=>{ if(CROP && $('#cropimg')) drawCrop(); });
}

/* ─── 進度備份 ───────────────────────────────────────────────
   放到 GitHub Pages 之後，作答紀錄仍然存在各自的瀏覽器裡——
   換裝置不會跟著走。沒有後端就沒有自動同步，所以做成手動搬一次：
   匯出成一個檔，傳到另一台，匯入。順便也是唯一的備份手段。

   下載在某些檢視環境（例如嵌在別人視窗裡的 artifact）會被擋，
   所以一定要同時提供「複製到剪貼簿」與「貼上文字匯入」這條路。 */
const BK_TAG = '通關港';

function exportState(withPics){
  const pack = {
    app: BK_TAG, v: 1,
    at: new Date().toISOString(),
    state: S
  };
  if(withPics && Object.keys(PICS).length) pack.pics = PICS;
  return JSON.stringify(pack);
}
function bkStamp(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
}
/* 回傳 true 代表瀏覽器接受了下載；被擋的話呼叫端要退回剪貼簿那條路 */
function downloadText(name, text){
  try{
    const blob = new Blob([text], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 4000);
    return true;
  }catch(e){ return false; }
}
/* 讀進來的東西先驗過再說。壞檔直接蓋掉現有進度是最不能發生的事。 */
function parsePack(text){
  let p;
  try{ p = JSON.parse(text); }catch(e){ return {err:'這不是有效的備份檔（JSON 讀不開）。'}; }
  if(!p || typeof p !== 'object') return {err:'檔案內容不對。'};
  if(p.app !== BK_TAG) return {err:'這不是通關港的備份檔。'};
  if(!p.state || typeof p.state !== 'object' || typeof p.state.records !== 'object')
    return {err:'備份檔裡沒有作答紀錄，不敢拿它蓋掉你現在的進度。'};
  const recs = Object.keys(p.state.records).length;
  const figs = p.state.figs ? Object.values(p.state.figs).filter(n=>n>0).length : 0;
  return {pack:p, recs, figs, pics: p.pics ? Object.keys(p.pics).length : 0,
          at: p.at ? new Date(p.at) : null};
}
function applyPack(p){
  try{
    S = Object.assign(defaults(), p.state);
    save();
    if(p.pics){
      PICS = {};
      for(const k in p.pics){
        const v = p.pics[k];
        PICS[k] = (typeof v === 'string') ? {d:v, t:false} : v;
      }
      savePics();
    }
    return true;
  }catch(e){ return false; }
}

         + (r.pics ? '、' + r.pics + ' 張夥伴圖像' : '') + '。';

/* ─── 雲端同步（Supabase）─────────────────────────────────────
   目標：手機與電腦接得上，清掉瀏覽器資料也不會消失。

   幾個刻意的決定：
   · **不用 SDK，只用 fetch。** 這頁的價值之一是單一自足的 HTML，
     載入外部函式庫就沒了。Supabase 的 REST 與 Auth 都是純 HTTP。
   · **金鑰不寫進原始碼。** repo 是公開的。網址與 anon key 由使用者自己填，
     存在本機（`tkg.cloud`）。anon key 本來就是設計成公開的，真正的防線是資料庫的 RLS。
   · **不做自動雙向合併。** 間隔複習的排程被錯誤合併會直接毀掉學習節奏。
     三個動作都要使用者自己按，而且按之前一定先看到「雲端有什麼 vs 本機有什麼」。
   · 網路請求在 artifact 檢視環境會被擋，這套只在 GitHub Pages／本機檔案上有效。 */
const LSC = 'tkg.cloud';
let CLOUD = (()=>{ try{ return JSON.parse(localStorage.getItem(LSC)||'{}'); }catch(e){ return {}; } })();
function saveCloud(){ try{ localStorage.setItem(LSC, JSON.stringify(CLOUD)); return true; }catch(e){ return false; } }
const cloudReady = ()=> !!(CLOUD.url && CLOUD.key);
const cloudSignedIn = ()=> !!(cloudReady() && CLOUD.access && CLOUD.uid);

function cloudBase(){ return String(CLOUD.url||'').replace(/\/+$/,''); }
async function cloudFetch(path, opt){
  opt = opt || {};
  const h = Object.assign({
    'apikey': CLOUD.key,
    'Content-Type': 'application/json'
  }, opt.headers || {});
  if(CLOUD.access) h['Authorization'] = 'Bearer ' + CLOUD.access;
  const r = await fetch(cloudBase() + path, Object.assign({}, opt, {headers:h}));
  return r;
}
/* access token 一小時就過期，過期了先用 refresh token 換一張再重試 */
async function cloudRefresh(){
  if(!CLOUD.refresh) return false;
  try{
    const r = await fetch(cloudBase()+'/auth/v1/token?grant_type=refresh_token', {
      method:'POST',
      headers:{'apikey':CLOUD.key, 'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: CLOUD.refresh})
    });
    if(!r.ok) return false;
    const j = await r.json();
    if(!j.access_token) return false;
    CLOUD.access = j.access_token;
    CLOUD.refresh = j.refresh_token || CLOUD.refresh;
    CLOUD.uid = (j.user && j.user.id) || CLOUD.uid;
    saveCloud();
    return true;
  }catch(e){ return false; }
}
async function cloudTry(path, opt){
  let r = await cloudFetch(path, opt);
  if(r.status === 401 && await cloudRefresh()) r = await cloudFetch(path, opt);
  return r;
}

/* 寄登入信。使用者點信裡的連結回到本站，token 掛在網址的 # 後面 */
async function cloudSendLink(email){
  const back = location.origin + location.pathname;
  const r = await fetch(cloudBase()+'/auth/v1/otp', {
    method:'POST',
    headers:{'apikey':CLOUD.key, 'Content-Type':'application/json'},
    body: JSON.stringify({email, create_user:true, options:{email_redirect_to:back}})
  });
  if(r.ok) return {ok:true};
  let msg = '寄送失敗（' + r.status + '）。';
  try{ const j = await r.json(); if(j.msg||j.error_description||j.message) msg += (j.msg||j.error_description||j.message); }catch(e){}
  return {ok:false, err:msg};
}
/* 從信裡回來時，網址的 hash 會帶著 token。收下就清掉，不要留在網址列。 */
function cloudCatchHash(){
  const h = location.hash || '';
  if(h.indexOf('access_token=') < 0) return false;
  const p = new URLSearchParams(h.slice(1));
  const at = p.get('access_token'), rt = p.get('refresh_token');
  if(!at) return false;
  CLOUD.access = at;
  if(rt) CLOUD.refresh = rt;
  try{
    const body = JSON.parse(atob(at.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    CLOUD.uid = body.sub; CLOUD.email = body.email || CLOUD.email;
  }catch(e){}
  saveCloud();
  history.replaceState(null, '', location.origin + location.pathname + location.search);
  return true;
}
/* 用信裡的 6 位數驗證碼登入。比點連結好——手機不用在信箱與瀏覽器之間跳，
   也不會被「連結在別的瀏覽器開啟」搞死。
   前提：Supabase 的 Magic Link 信件範本要含 {{ .Token }}。 */
async function cloudVerifyCode(email, code){
  try{
    const r = await fetch(cloudBase()+'/auth/v1/verify', {
      method:'POST',
      headers:{'apikey':CLOUD.key, 'Content-Type':'application/json'},
      body: JSON.stringify({type:'email', email, token:String(code).trim()})
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.access_token){
      return {err:'驗證失敗（'+r.status+'）。'+(j.msg||j.error_description||j.message||'確認碼有沒有打錯，或已經過期。')};
    }
    CLOUD.access = j.access_token;
    CLOUD.refresh = j.refresh_token || CLOUD.refresh;
    CLOUD.uid = (j.user && j.user.id) || CLOUD.uid;
    CLOUD.email = (j.user && j.user.email) || email;
    saveCloud();
    return {ok:true};
  }catch(e){ return {err:'連不上（'+(e&&e.message||e)+'）。'}; }
}
function cloudSignOut(){
  delete CLOUD.access; delete CLOUD.refresh; delete CLOUD.uid; delete CLOUD.email;
  saveCloud();
}

/* ─── 讀寫 ───────────────────────────────────────────────── */
async function cloudPull(){
  const r = await cloudTry('/rest/v1/progress?select=data,updated_at&user_id=eq.'+encodeURIComponent(CLOUD.uid), {method:'GET'});
  if(!r.ok) return {err:'讀取失敗（'+r.status+'）。'+(r.status===401?'登入可能過期了，請重新登入。':'')};
  const rows = await r.json();
  if(!rows.length) return {empty:true};
  return {data: rows[0].data, at: rows[0].updated_at};
}
async function cloudPush(){
  const body = [{ user_id: CLOUD.uid, data: {state:S, pics:PICS}, updated_at: new Date().toISOString() }];
  const r = await cloudTry('/rest/v1/progress?on_conflict=user_id', {
    method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify(body)
  });
  if(!r.ok){
    let t=''; try{ t=await r.text(); }catch(e){}
    return {err:'上傳失敗（'+r.status+'）。'+t.slice(0,160)};
  }
  CLOUD.lastPush = new Date().toISOString(); saveCloud();
  return {ok:true};
}
/* 合併：逐題取「作答時間較新」的那一筆。
   這是這份資料唯一安全的合併方式——同一題在兩台各答過，較新的那次才反映現況。 */
function mergeRecords(mine, theirs){
  const out = Object.assign({}, mine);
  let added = 0, updated = 0;
  for(const id in theirs){
    const t = theirs[id], m = out[id];
    if(!m){ out[id] = t; added++; continue; }
    if((t.at||0) > (m.at||0)){ out[id] = t; updated++; }
  }
  return {records: out, added, updated};
}

    const r = await cloudVerifyCode(m, c);
    if(r.err){ CL_MSG=r.err; SFX.hold(); return; }
    SFX.done(); CL_MSG='登入成功。接下來按「合併」就能跟另一台接上。';
  }));
  on('#cl-check', ()=>clGuard(async ()=>{
    CL_REMOTE = await cloudPull();
    CL_MSG = CL_REMOTE.err ? CL_REMOTE.err
           : CL_REMOTE.empty ? '雲端還沒有資料。按「上傳」放上去。'
           : '讀到了，看上面的數字。';
  }));
  on('#cl-push', ()=>clGuard(async ()=>{
    if(!confirm('要用這台的 '+recs+' 櫃覆蓋雲端上的那一份嗎？')) { CL_MSG='已取消。'; return; }
    const r = await cloudPush();
    if(r.err){ CL_MSG=r.err; SFX.hold(); return; }
    CL_REMOTE = await cloudPull();
    SFX.done(); CL_MSG='上傳完成。';
  }));
  on('#cl-pull', ()=>clGuard(async ()=>{
    const r = await cloudPull();
    if(r.err){ CL_MSG=r.err; SFX.hold(); return; }
    if(r.empty){ CL_MSG='雲端是空的，沒有東西可以下載。'; return; }
    const n = Object.keys((r.data.state&&r.data.state.records)||{}).length;
    if(!confirm('雲端有 '+n+' 櫃，這台有 '+recs+' 櫃。\n\n下載會「覆蓋」這台的進度，無法復原。要繼續嗎？')){
      CL_MSG='已取消，什麼都沒有改。'; return;
    }
    S = Object.assign(defaults(), r.data.state);
    if(r.data.pics){ PICS={};
      for(const k in r.data.pics){ const v=r.data.pics[k]; PICS[k]=(typeof v==='string')?{d:v,t:false}:v; }
      savePics(); }
    save(); applyPrefs(); CL_REMOTE=r;
    SFX.done(); CL_MSG='下載完成，這台現在有 '+Object.keys(S.records).length+' 櫃。';
  }));
  on('#cl-merge', ()=>clGuard(async ()=>{
    const r = await cloudPull();
    if(r.err){ CL_MSG=r.err; SFX.hold(); return; }
    if(r.empty){ CL_MSG='雲端是空的，先按「上傳」。'; return; }
    const theirs = (r.data.state&&r.data.state.records)||{};
    const m = mergeRecords(S.records, theirs);
    if(!m.added && !m.updated){ CL_REMOTE=r; CL_MSG='兩邊一樣，沒有東西要合併。'; return; }
    if(!confirm('合併會：\n　新增 '+m.added+' 題（這台沒有、雲端有）\n　更新 '+m.updated+' 題（雲端那次比較新）\n\n'
                +'其餘保持不動。合併後會自動上傳。要繼續嗎？')){ CL_MSG='已取消。'; return; }
    S.records = m.records;
    // 公仔與膠料取兩邊較多的，不會因為合併而變少
    const tf = (r.data.state&&r.data.state.figs)||{};
    S.figs = S.figs||{};
    for(const k in tf) S.figs[k] = Math.max(S.figs[k]||0, tf[k]||0);
    // 圖片與外觀設定也要跟過來：這台沒有的就用雲端那份，本機已有的不動
    if(r.data.pics){
      let got=0;
      for(const k in r.data.pics){
        if(PICS[k]) continue;
        const v=r.data.pics[k];
        PICS[k]=(typeof v==='string')?{d:v,t:false}:v; got++;
      }
      if(got) savePics();
    }
    const ts=r.data.state||{};
    if(ts.picColor) S.picColor = Object.assign({}, ts.picColor, S.picColor||{});
    ['palette','picPlate','examDate','goal','goalAuto'].forEach(k=>{
      if(ts[k]!==undefined && (S[k]===undefined || S[k]===defaults()[k])) S[k]=ts[k];
    });
    S.goo   = Math.max(S.goo||0,   (r.data.state&&r.data.state.goo)||0);
    S.boxes = Math.max(S.boxes||0, (r.data.state&&r.data.state.boxes)||0);
    S.best  = Math.max(S.best||0,  (r.data.state&&r.data.state.best)||0);
    save();
    const up = await cloudPush();
    CL_REMOTE = await cloudPull();
    applyPrefs();
    SFX.done();
    CL_MSG = '合併完成：新增 '+m.added+' 題、更新 '+m.updated+' 題，現在共 '
           + Object.keys(S.records).length + ' 櫃。' + (up.err ? '（但回傳雲端失敗：'+up.err+'）' : '已回傳雲端。');
  }));
}

      <span class="seg" id="picplate">${[['圓框',1],['原樣',0]]
        .map(([l,v])=>`<button data-v="${v}" aria-pressed="${(S.picPlate!==false?1:0)===v}">${l}</button>`).join('')}</span></div>
    <div class="set-row"><span class="lab">圖片佔用<span class="sub">跟作答紀錄分開存，互不影響。</span></span>
      <b class="plate">${Math.round(picBytes()/1024)} KB</b></div>
    <input type="file" id="picfile" accept="image/*" class="hidden">

    <div class="set-row"><span class="lab">考試日期<span class="sub">預設為 116 年 8 月上旬的估計值，正式簡章公布後請改成正確日期。</span></span>
      <input type="date" id="d" value="${S.examDate||''}"></div>
    <div class="set-row"><span class="lab">每日驗櫃目標<span class="sub">達標時汽笛會響，並自動結算今日清冊。</span></span>
      <span class="seg" id="goal">${[['自動',0],['10',10],['20',20],['30',30],['40',40]]
        .map(([l,n])=>`<button data-n="${n}" aria-pressed="${n===0? !!S.goalAuto : (!S.goalAuto && S.goal===n)}">${l}</button>`).join('')}</span></div>

      <b class="plate">${MC.filter(q=>q.accept&&q.accept.length).length} 題</b></div>

    <div class="set-row"><span class="lab">清空紀錄<span class="sub">刪掉所有作答、扣櫃與職級，無法復原。</span></span>
      <button class="btn-ghost btn" id="reset" style="flex:none;min-height:40px;padding:0 16px;font-size:13px">清空</button></div>`;

  $('#d').onchange=e=>{ S.examDate=e.target.value; save(); };
  $('#goal').onclick=e=>{ const b=e.target.closest('button'); if(!b)return;
    const n=+b.dataset.n;
    if(n===0){ S.goalAuto=true; } else { S.goalAuto=false; S.goal=n; }

  dock(`<button class="btn" id="back">回堆場</button>`);
  $('#back').onclick=()=>{ SFX.tap(); viewYard(); };

/* ─── 偏好套用 ───────────────────────────────────────────── */
function applyPrefs(){
  const r=document.documentElement;
  applyLayout();
  if(S.theme) r.setAttribute('data-theme',S.theme); else r.removeAttribute('data-theme');
  // 'pic' 不是 CSS 色票，是用行內變數覆蓋塗裝色，所以底層先掛 candy 的地面色
  if(S.palette==='pic') r.setAttribute('data-palette','candy');
  else if(S.palette) r.setAttribute('data-palette',S.palette); else r.removeAttribute('data-palette');
  applyPicPalette();
  r.style.setProperty('--zoom', S.zoom);
  $('#btn-sound').setAttribute('aria-pressed', S.sound);
  $('#wave1').classList.toggle('hidden', !S.sound);
  $('#wave2').classList.toggle('hidden', !S.sound);
  $('#mute').classList.toggle('hidden', S.sound);
}
/* 泡泡內容在 rAF 之後才寫入，事件必須委派 */
$('#bubble').addEventListener('click', e=>{
  const b=e.target.closest('.hintbtn');
  if(b && HINT_ACTION) HINT_ACTION(b.dataset.act);
});
$('#btn-sound').onclick=()=>{ S.sound=!S.sound; save(); applyPrefs(); if(S.sound) SFX.tap(); };
$('#btn-theme').onclick=()=>{
  const cur = S.theme || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  S.theme = cur==='dark'?'light':'dark'; save(); applyPrefs(); SFX.tap();
};
$('#btn-settings').onclick=()=>{ SFX.tap(); viewSettings(); };
$('#go-home').onclick=()=>{ SFX.tap(); viewYard(); };

applyPrefs();
// 從登入信回來時網址的 # 帶著 token，收下並清掉網址列
try{ cloudCatchHash(); }catch(e){}
viewYard();
</script>
