<!--
THESIS: 這不是題庫 App，是一座貨櫃堆場。每題是一只待驗貨櫃，答錯的櫃子被扣在堆場等複驗。
  拒絕「白底卡片＋藍色進度條＋綠對紅錯」的題庫預設，也拒絕卡通插畫港口的字面讀法。
OWN-WORLD: 真實碼頭的工業標識系統——ISO 6346 箱號牌、四家船公司塗裝色場（綠/藍/洋紅/黃）滿版鋪底、
  波浪鋼板肋紋、噴漆模板字、C1/C2/C3 通道燈。動物以模板噴漆語彙畫在櫃門上。Archivo Narrow 管編號，
  Noto Sans TC 管法條。白天＝水泥堆場，夜班＝瀝青與場燈。
STORY: 門式起重機把貨櫃吊進驗櫃區 → 申報答案 → 通道燈亮 →
  答對蓋放行章，答錯掃 X 光並進三段引導：先問這題在考什麼，再給線索卡與知識卡，最後才揭曉。
FIRST VIEWPORT: 頂部箱號牌顯示考試倒數與職級；今日驗櫃配額；四道滿版塗裝色場依序落下，
  各帶科目代號、動物模板與貨櫃堆疊進度；主要動作「開始今日驗櫃」壓在拇指區。
FORM: 貨櫃碼頭標記系統，grounded 清單第 3 順位，seed key 623e7caf。
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

<style>
/* ─── tokens ─────────────────────────────────────────────── */
:root{
  /* 白天堆場 */
  --yard:#E4E1D9; --yard-2:#EFEDE7; --yard-3:#D6D2C8;
  --ink:#15181C; --ink-2:#4A5058; --ink-3:#5A616B;
  --line:rgba(21,24,28,.18); --line-2:rgba(21,24,28,.08);
  --plate:#181B20; --plate-ink:#F3F1EB;
  --rib-d:rgba(0,0,0,.13); --rib-l:rgba(255,255,255,.16);
  --lamp-off:rgba(21,24,28,.14);
  --shadow:0 1px 2px rgba(21,24,28,.10), 0 8px 24px -8px rgba(21,24,28,.22);
  --shadow-lift:0 2px 4px rgba(21,24,28,.12), 0 18px 40px -12px rgba(21,24,28,.34);
  --ink-blend:multiply;

  /* 船公司塗裝 */
  --practice:#0E7F47; --practice-on:#FFFFFF;
  --law:#1D74AE;      --law-on:#FFFFFF;
  --tariff:#C8006E;   --tariff-on:#FFFFFF;
  --english:#E08A00;  --english-on:#1A1205;
  /* -lit：同一支油漆在場燈下的樣子，只用於深色地面上的圖形，不用於色場底 */
  --practice-lit:#0E7F47; --law-lit:#1D74AE; --tariff-lit:#C8006E; --english-lit:#E08A00;

  /* 通道燈 */
  --c1:#0C7040; --c2:#C67A00; --c3:#C62828;
  /* 坐在通道燈色上的字。硬寫 #fff 會在亮色燈上爆掉，所以每支燈各配一支墨 */
  --c1-ink:#FFFFFF; --c2-ink:#1A1205; --c3-ink:#FFFFFF;
  --warn-ink:#8A5600; --neg-ink:#A81E1E;
  /* 隱藏款的金標。跟塗裝色同一條規則：深淺兩主題各一支，色場底不共用 */
  --gold:#8A6A12; --gold-lit:#8A6A12;

  --r:3px;
  --tap:52px;
  /* 頁面左右留白。三個斷點各一個值：手機 14、平板 22、電腦 0（由 grid 給）。
     新元件一律用它，不要再寫死 14px——寫死的會在寬版跟其他元件差 14~22px。 */
  --pad:14px;
  --ease:cubic-bezier(.16,.84,.32,1);
  --font-cjk:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mark:"Archivo Narrow","Archivo",var(--font-cjk);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --yard:#0D1014; --yard-2:#141920; --yard-3:#1D242C;
  --ink:#EDEBE5; --ink-2:#A2AAB4; --ink-3:#838B96;
  --line:rgba(237,235,229,.16); --line-2:rgba(237,235,229,.07);
  --plate:#EDEBE5; --plate-ink:#0D1014;
  --rib-d:rgba(0,0,0,.34); --rib-l:rgba(255,255,255,.09);
  --lamp-off:rgba(237,235,229,.13);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -10px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 22px 48px -14px rgba(0,0,0,.8);
  --ink-blend:screen;
  --practice-lit:#16A85C; --law-lit:#3B9BDC; --tariff-lit:#F0198A; --english-lit:#F5B325;
  --c1:#35D07F; --c2:#F5B325; --c3:#FF6B6B;
  --c1-ink:#04241A; --c2-ink:#1A1205; --c3-ink:#2E0A0A;
  --warn-ink:#F5B325; --neg-ink:#FF9A9A;
  --gold:#D4A82A; --gold-lit:#E8C24A;
}}
:root[data-theme="dark"]{
  --yard:#0D1014; --yard-2:#141920; --yard-3:#1D242C;
  --ink:#EDEBE5; --ink-2:#A2AAB4; --ink-3:#838B96;
  --line:rgba(237,235,229,.16); --line-2:rgba(237,235,229,.07);
  --plate:#EDEBE5; --plate-ink:#0D1014;
  --rib-d:rgba(0,0,0,.34); --rib-l:rgba(255,255,255,.09);
  --lamp-off:rgba(237,235,229,.13);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -10px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 22px 48px -14px rgba(0,0,0,.8);
  --ink-blend:screen;
  --practice-lit:#16A85C; --law-lit:#3B9BDC; --tariff-lit:#F0198A; --english-lit:#F5B325;
  --c1:#35D07F; --c2:#F5B325; --c3:#FF6B6B;
  --c1-ink:#04241A; --c2-ink:#1A1205; --c3-ink:#2E0A0A;
  --warn-ink:#F5B325; --neg-ink:#FF9A9A;
  --gold:#D4A82A; --gold-lit:#E8C24A;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--yard); color:var(--ink);
  font-family:var(--font-cjk); line-height:1.68;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  font-size:calc(16px * var(--zoom,1));
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(120% 60% at 50% -14%, rgba(255,214,140,.16), transparent 62%),
    radial-gradient(80% 40% at 88% 8%, rgba(120,190,255,.09), transparent 60%);
}
#app{position:relative; z-index:1; max-width:760px; margin:0 auto; padding-bottom:var(--dockspace,112px)}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:2px}

.rib{position:relative; isolation:isolate}
.rib::after{
  content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:repeating-linear-gradient(90deg,
    var(--rib-d) 0 1px, transparent 1px 3px,
    var(--rib-l) 3px 4px, transparent 4px 17px);
}
.plate{
  font-family:var(--font-mark); font-weight:700;
  letter-spacing:.10em; text-transform:uppercase;
  font-variant-numeric:tabular-nums;
}

/* ─── header ────────────────────────────────────────────── */
header{position:sticky; top:0; z-index:30; background:var(--yard); border-bottom:1px solid var(--line)}
.header-inner{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:10px; padding:10px 14px}
@media (min-width:768px){ .header-inner{padding:10px 22px} }
header::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg,var(--practice-lit) 0 25%,var(--law-lit) 25% 50%,var(--tariff-lit) 50% 75%,var(--english-lit) 75% 100%);
  opacity:.9;
}
.wordmark{display:flex; align-items:center; gap:8px; margin-right:auto; min-width:0}
.wordmark b{font-weight:900; font-size:19px; letter-spacing:.14em}
.iconbtn{
  width:var(--tap); height:40px; display:grid; place-items:center;
  border:1px solid var(--line); border-radius:var(--r); color:var(--ink-2);
  transition:color .18s, border-color .18s, background .18s;
}
.iconbtn:hover{color:var(--ink); border-color:var(--ink-3); background:var(--yard-2)}
.iconbtn[aria-pressed="true"]{color:var(--ink); border-color:var(--ink); background:var(--yard-3)}
.iconbtn svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

/* ─── 倒數牌 ─────────────────────────────────────────────── */
.countdown{
  display:flex; align-items:stretch; margin:14px 14px 0;
  background:var(--plate); color:var(--plate-ink); border-radius:var(--r);
  overflow:hidden; box-shadow:var(--shadow);
}
.cd-owner{display:grid; place-items:center; padding:0 13px; border-right:1px solid rgba(128,128,128,.4); font-size:11px; opacity:.72}
.cd-main{display:flex; align-items:baseline; gap:10px; padding:11px 13px; flex:1; min-width:0}
.cd-num{font-family:var(--font-mark); font-weight:700; font-size:30px; line-height:1; letter-spacing:.02em; white-space:nowrap; flex:none}
.cd-lab{font-size:12px; opacity:.78; line-height:1.42; min-width:0}
.cd-edit{padding:0 12px; font-size:11px; opacity:.62; flex:none; border-left:1px solid rgba(128,128,128,.4); white-space:nowrap}
.cd-edit:hover{opacity:1}

/* ─── 職級與船期 ─────────────────────────────────────────── */
.rankbar{
  display:flex; align-items:center; gap:11px; margin:10px 14px 0;
  padding:11px 13px; border:1px solid var(--line); border-radius:var(--r); background:var(--yard-2);
}
.rk-badge{width:34px; height:34px; flex:none; color:var(--ink-2)}
.rk-badge svg{width:100%; height:100%; display:block}
.rk-t{flex:1; min-width:0; line-height:1.42}
.rk-t b{font-size:14.5px; display:block}
.rk-t .sub{display:block; font-size:11.5px; color:var(--ink-3)}
.rk-bar{display:block; height:4px; background:var(--yard-3); border-radius:99px; overflow:hidden; margin-top:5px}
.rk-bar i{display:block; height:100%; background:var(--ink-2); border-radius:99px; transition:width .6s var(--ease)}
.streak{
  flex:none; text-align:center; font-size:11px; color:var(--ink-2);
  padding:5px 9px; border:1px dashed var(--line); border-radius:var(--r); line-height:1.3;
}
.streak b{display:block; font-family:var(--font-mark); font-size:17px; color:var(--ink)}
.streak u{display:block; font-family:var(--font-mark); font-size:9.5px; text-decoration:none;
  color:var(--ink-3); letter-spacing:.06em; margin-top:1px}

/* ─── 今日配額 ───────────────────────────────────────────── */
.leavecard{
  margin:12px 14px 0; padding:11px 13px; font-size:13px; line-height:1.72;
  color:var(--ink-2); border:1px dashed var(--line); border-radius:var(--r);
}
.leavecard b{display:block; font-size:10.5px; letter-spacing:.16em; color:var(--ink-3); margin-bottom:2px}
.leavecard em{font-style:normal; font-weight:700; color:var(--ink)}
.quota{margin:10px 14px 0; display:flex; align-items:center; gap:11px; font-size:12.5px; color:var(--ink-2)}
.quota>span:first-child{flex:none; white-space:nowrap}
.quota-bar{flex:1; height:8px; background:var(--yard-3); border-radius:99px; overflow:hidden}
.quota-fill{height:100%; background:var(--ink); border-radius:99px; transition:width .55s var(--ease)}
.quota b{font-family:var(--font-mark); color:var(--ink); font-size:14px; font-variant-numeric:tabular-nums; flex:none; white-space:nowrap}

/* ─── 船席（科目色場）─────────────────────────────────────── */
.berths{margin:16px 0 0}
.berth{
  display:grid; grid-template-columns:1fr auto; align-items:end; gap:10px;
  width:100%; text-align:left; padding:15px 14px 14px;
  background:var(--c); color:var(--on); position:relative;
  border-top:1px solid rgba(0,0,0,.22); transition:filter .2s var(--ease);
}
.berth:first-child{border-top:none}
.berth:hover{filter:brightness(1.07)}
.berth:active{filter:brightness(.94)}
.berth-code{font-family:var(--font-mark); font-size:11.5px; letter-spacing:.2em; opacity:.82; margin-bottom:2px}
.berth-name{font-weight:900; font-size:25px; letter-spacing:.03em; line-height:1.16; margin:0 0 8px}
.berth-meta{display:flex; align-items:center; gap:7px; font-size:12.5px; opacity:.96; flex-wrap:wrap}
.berth-meta .sep{opacity:.45}
.berth-meta b{font-family:var(--font-mark); font-size:14px; font-variant-numeric:tabular-nums}
.berth-mascot{display:block; width:80px; height:80px; flex:none; opacity:.97; margin-bottom:-4px}

/* 堆場格位圖：每格 2 題，兩層堆疊 */
.stack{display:grid; grid-template-columns:repeat(10,1fr); gap:2px; margin-top:10px; max-width:206px}
.stack i{height:8px; background:currentColor; opacity:.3; border-radius:1px; transition:opacity .3s}
.stack i.on{opacity:1}
.stack i.hold{opacity:.62; box-shadow:inset 0 0 0 1px currentColor; background:transparent}

/* ─── 拇指區 ─────────────────────────────────────────────── */
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--yard) 62%, transparent);
}
.dock-inner{max-width:760px; margin:0 auto; display:flex; gap:9px}
.btn{
  flex:1; min-height:var(--tap); display:flex; align-items:center; justify-content:center; gap:9px;
  background:var(--plate); color:var(--plate-ink); border-radius:var(--r);
  font-weight:700; font-size:16px; letter-spacing:.05em; box-shadow:var(--shadow);
  transition:transform .16s var(--ease), box-shadow .2s var(--ease), opacity .2s;
}
.btn:hover{box-shadow:var(--shadow-lift); transform:translateY(-1px)}
.btn:active{transform:translateY(0); box-shadow:var(--shadow)}
.btn[disabled]{opacity:.42; pointer-events:none}
.btn-ghost{flex:0 0 auto; padding:0 18px; background:transparent; color:var(--ink-2); border:1px solid var(--line); box-shadow:none}
.btn-ghost:hover{color:var(--ink); border-color:var(--ink-3); box-shadow:none}
.btn svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

/* ─── 門式起重機 ─────────────────────────────────────────── */
.gantry{position:relative; height:34px; margin:12px 0 0; color:var(--ink-2)}
.gantry .rail{position:absolute; top:5px; left:0; right:0; height:3px; background:currentColor; opacity:.42; border-radius:1px}
.gantry .leg{position:absolute; top:5px; width:2px; height:12px; background:currentColor; opacity:.3}
.gantry .leg.l{left:3px} .gantry .leg.r{right:3px}
.gantry .trolley{position:absolute; top:0; left:50%; width:46px; height:13px; margin-left:-23px; background:currentColor; opacity:.72; border-radius:2px}
.gantry .cable{position:absolute; top:13px; width:2px; height:15px; background:currentColor; opacity:.85; transform-origin:top center}
.gantry .cable.a{left:8px} .gantry .cable.b{right:8px}
.gantry .spreader{position:absolute; left:0; right:0; bottom:0; height:6px; background:var(--lit); border-radius:1px; opacity:.9}

/* ─── 驗櫃區 ─────────────────────────────────────────────── */
.bay{padding:0 14px; position:relative}
.bay-plate{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--yard-2); font-size:11.5px; color:var(--ink-2);
}
.bay-plate .swatch{width:11px; height:22px; background:var(--lit); border-radius:1px; flex:none}
/* 加了考點徽記之後這一列很擠：科目名可截斷，其餘一律不換行 */
.bay-plate .bp-t{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bay-plate .no{margin-left:auto; color:var(--ink); font-size:11.5px; flex:none; white-space:nowrap}
.bay-plate .lamps{flex:none}
@media (max-width:430px){ .bay-plate .bp-t{flex:0 1 auto; max-width:7.2em} }
.combo{
  font-family:var(--font-mark); font-size:11px; padding:3px 7px; border-radius:99px;
  background:var(--c1); color:#fff; letter-spacing:.08em; white-space:nowrap;
}
.oldchip{
  font-family:var(--font-mark); font-size:10.5px; padding:2px 7px; border-radius:99px;
  border:1px solid var(--warn-ink); color:var(--warn-ink); letter-spacing:.08em; white-space:nowrap;
}
.hotchip{
  font-family:var(--font-mark); font-size:10.5px; padding:2px 8px; border-radius:99px;
  background:var(--ink); color:var(--yard); letter-spacing:.08em; white-space:nowrap;
}
/* 題幹標記 */
.mk-neg{color:var(--neg-ink); font-weight:900;
  text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px}
.mk-num{font-weight:700; font-variant-numeric:tabular-nums;
  box-shadow:inset 0 -2px 0 color-mix(in srgb, var(--lit) 55%, transparent)}
.mk-law{font-weight:inherit; border-bottom:1px dashed var(--ink-3)}
.stem{font-size:17.5px; line-height:1.86; margin:18px 0 4px; letter-spacing:.012em; max-width:38em; white-space:pre-line}
.stem em{font-style:normal; font-weight:700; background:linear-gradient(transparent 62%, color-mix(in srgb, var(--lit) 34%, transparent) 62%)}
.opts{list-style:none; margin:18px 0 0; padding:0; display:grid; gap:9px}
.opt{
  display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start;
  width:100%; text-align:left; padding:13px 14px; min-height:var(--tap);
  border:1px solid var(--line); border-radius:var(--r); background:var(--yard-2);
  font-size:15.5px; line-height:1.62;
  transition:border-color .18s, background .18s, transform .16s var(--ease);
}
.opt:hover{border-color:var(--ink-3); background:var(--yard-3)}
.opt:active{transform:scale(.995)}
.opt-mark{
  font-family:var(--font-mark); font-size:13px; width:23px; height:23px; flex:none;
  display:grid; place-items:center; border:1.5px solid var(--ink-3); border-radius:50%;
  color:var(--ink-2); margin-top:1px; transition:all .18s;
}
.opt[aria-pressed="true"]{border-color:var(--ink); background:var(--yard-3)}
.opt[aria-pressed="true"] .opt-mark{background:var(--ink); color:var(--yard); border-color:var(--ink)}
.opt[data-verdict="c1"]{border-color:var(--c1); background:color-mix(in srgb, var(--c1) 12%, var(--yard-2))}
.opt[data-verdict="c1"] .opt-mark{background:var(--c1); border-color:var(--c1); color:var(--c1-ink)}
.opt[data-verdict="c2"]{border-color:var(--c2); background:color-mix(in srgb, var(--c2) 10%, var(--yard-2))}
.opt[data-verdict="c2"] .opt-mark{background:var(--c2); border-color:var(--c2); color:var(--c2-ink)}
.opt[data-verdict="c3"]{border-color:var(--c3); background:color-mix(in srgb, var(--c3) 11%, var(--yard-2))}
.opt[data-verdict="c3"] .opt-mark{background:var(--c3); border-color:var(--c3); color:var(--c3-ink)}
.opts.locked .opt{pointer-events:none}
/* 作答後把沒選到的選項退到背景。原本用 opacity:.58，文字掉到 4.15:1、
   字母徽章只剩 2.67:1——而檢討錯題正是要逐字讀那三個選項的時候。
   改成用色階與邊框做弱化，強調效果一樣，字仍然讀得到。 */
.opts.locked .opt:not([data-verdict]){background:transparent; border-color:var(--line-2); color:var(--ink-2)}
.opts.locked .opt:not([data-verdict]) .opt-mark{color:var(--ink-2); border-color:var(--line-2)}

/* ─── 通道燈 ─────────────────────────────────────────────── */
.lamps{display:flex; gap:7px; align-items:center; margin-left:auto}
.lamp{width:9px; height:9px; border-radius:50%; background:var(--lamp-off); transition:background .3s, box-shadow .3s}
.lamp[data-on="c1"]{background:var(--c1); box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 26%, transparent), 0 2px 10px color-mix(in srgb,var(--c1) 55%, transparent)}
.lamp[data-on="c2"]{background:var(--c2); box-shadow:0 0 0 3px color-mix(in srgb,var(--c2) 26%, transparent), 0 2px 10px color-mix(in srgb,var(--c2) 55%, transparent)}
.lamp[data-on="c3"]{background:var(--c3); box-shadow:0 0 0 3px color-mix(in srgb,var(--c3) 26%, transparent), 0 2px 10px color-mix(in srgb,var(--c3) 55%, transparent)}
.lamp.sweep{animation:lampSweep .45s ease-in-out}

/* ─── 放行章 ─────────────────────────────────────────────── */
.stamp{
  position:absolute; right:8%; top:26%; width:120px; z-index:5;
  color:var(--c1); pointer-events:none; mix-blend-mode:var(--ink-blend);
  animation:stampIn .46s cubic-bezier(.2,1.6,.4,1) both;
}
.stamp svg{width:100%; height:auto; display:block}
.stamp::after{
  content:""; position:absolute; inset:6%; border-radius:50%;
  box-shadow:0 0 0 3px currentColor; filter:blur(7px);
  animation:inkBleed .7s ease-out both;
}
@keyframes stampIn{
  0%{opacity:0; transform:rotate(-26deg) scale(2.7)}
  58%{opacity:.96; transform:rotate(-10deg) scale(.93)}
  100%{opacity:.92; transform:rotate(-12deg) scale(1)}
}
@keyframes inkBleed{0%{opacity:0} 40%{opacity:.55} 100%{opacity:.12}}

/* ─── X 光掃描 ───────────────────────────────────────────── */
.xray{
  position:absolute; left:0; right:0; top:0; height:120px; z-index:4; pointer-events:none;
  background:linear-gradient(180deg,
    transparent 0%,
    color-mix(in srgb, var(--c3) 18%, transparent) 42%,
    color-mix(in srgb, var(--c3) 52%, transparent) 50%,
    color-mix(in srgb, var(--c3) 18%, transparent) 58%,
    transparent 100%);
  filter:blur(2px);
  animation:scan 1s var(--ease) both;
}
@keyframes scan{
  0%{transform:translateY(-120px); opacity:0}
  14%{opacity:1}
  86%{opacity:1}
  100%{transform:translateY(var(--scanTo,520px)); opacity:0}
}

/* ─── 夥伴泡泡 ───────────────────────────────────────────── */
/* 手機：#sidecol 不參與版面，夥伴仍是浮在底部的一層，面板不出現 */
#sidecol{display:contents}
#side-panel{display:none}
.companion{
  position:fixed; left:0; right:0; bottom:calc(12px + var(--tap) + 12px + env(safe-area-inset-bottom));
  z-index:39; padding:0 14px; pointer-events:none;
}
.companion-inner{max-width:760px; margin:0 auto; display:flex; align-items:flex-end; gap:9px}
.mascot-dock{width:62px; height:62px; flex:none; filter:drop-shadow(0 4px 10px rgba(0,0,0,.28))}
.bubble{
  flex:1; min-width:0; background:var(--yard-2); border:1px solid var(--line);
  border-radius:var(--r); padding:11px 14px; font-size:14.5px; line-height:1.66;
  box-shadow:var(--shadow); position:relative; pointer-events:auto;
  opacity:0; transform:translateY(6px); transition:opacity .3s var(--ease), transform .3s var(--ease);
}
.bubble.show{opacity:1; transform:none}
.bubble::before{
  content:""; position:absolute; left:-6px; bottom:15px; width:10px; height:10px;
  background:var(--yard-2); border-left:1px solid var(--line); border-bottom:1px solid var(--line);
  transform:rotate(45deg);
}
.bubble em{font-style:normal; font-weight:700; color:var(--ink)}
.bubble .who{font-size:11.5px; color:var(--ink-3); letter-spacing:.1em; display:block; margin-bottom:2px}
.hintbtn{
  display:flex; width:fit-content; align-items:center; gap:6px; margin-top:10px; padding:7px 12px;
  border:1px solid var(--line); border-radius:var(--r); font-size:13px; color:var(--ink-2);
}
.hintbtn:hover{color:var(--ink); border-color:var(--ink-3); background:var(--yard-3)}
.hintbtn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.clues{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.clue{
  font-family:var(--font-mark); font-size:12px; letter-spacing:.06em;
  padding:4px 9px; border:1px dashed var(--ink-3); border-radius:var(--r); color:var(--ink-2);
}

/* ─── 高頻考點 ───────────────────────────────────────────── */
.hot{
  display:block; width:100%; text-align:left; padding:13px var(--pad);
  border-bottom:1px solid var(--line-2); transition:background .18s;
}
.hot:hover{background:var(--yard-2)}
.hot-h{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:7px}
.hot-h .swatch{width:4px; height:16px; background:var(--lit); border-radius:99px; flex:none}
.hot-y{font-size:11px; color:var(--ink-3); letter-spacing:.06em}
.hot-s{font-size:11px; color:var(--ink-3); margin-left:auto}
.hot-d{font-size:11px; color:var(--c1)}
.hot-q{display:block; font-size:14.5px; line-height:1.6; margin-bottom:8px}
.hot-a{display:grid; gap:3px}
.hot-a span{display:flex; gap:8px; font-size:12px; color:var(--ink-2); line-height:1.55}
.hot-a i{font-family:var(--font-mark); font-style:normal; color:var(--ink-3); flex:none; width:2.4em}
.hot-a em{font-style:normal; min-width:0}
.hot-a .past{color:var(--ink-3)}
.hot-a .past u{display:inline-block; font-family:var(--font-mark); font-size:10px;
  text-decoration:none; border:1px solid var(--line); border-radius:99px;
  padding:0 6px; margin-right:6px; vertical-align:1px}

/* ─── 知識卡 ─────────────────────────────────────────────── */
.note{
  border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  background:var(--yard); margin-top:10px;
}
.note-h{display:flex; align-items:baseline; gap:9px; padding:10px 13px; background:var(--yard-3); flex-wrap:wrap}
.note-h b{font-size:15px; font-weight:900; letter-spacing:.04em}
.note-h .s{font-size:12.5px; color:var(--ink-2)}
.note-h .tg{
  margin-left:auto; font-family:var(--font-mark); font-size:10.5px; letter-spacing:.08em;
  padding:2px 7px; border:1px solid var(--ink-3); border-radius:99px; color:var(--ink-2); white-space:nowrap;
}
.note-b{padding:12px 13px; font-size:14px; line-height:1.78; white-space:pre-line}
.note-n{
  padding:10px 13px 12px; margin:0 13px 12px; font-size:13px; line-height:1.72;
  color:var(--ink-2); border-top:1px dashed var(--line); white-space:pre-line;
}
.deck-grid{display:grid; gap:12px; padding:0 14px}
.deck-lab{
  margin:22px 14px 0; font-family:var(--font-mark); font-size:11.5px;
  letter-spacing:.2em; color:var(--ink-3);
}

/* ─── 通關清冊 ───────────────────────────────────────────── */
.manifest{
  margin:14px; border:1.5px solid var(--ink); border-radius:var(--r);
  background:var(--yard-2); position:relative; overflow:hidden;
}
.mf-h{padding:13px 15px; border-bottom:1.5px solid var(--ink); display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.mf-h b{font-size:17px; font-weight:900; letter-spacing:.06em}
.mf-h .d{margin-left:auto; font-family:var(--font-mark); font-size:12px; color:var(--ink-2)}
.mf-row{display:flex; align-items:center; gap:12px; padding:11px 15px; border-bottom:1px solid var(--line-2); font-size:14px}
.mf-row .k{flex:1; color:var(--ink-2)}
.mf-row .v{font-family:var(--font-mark); font-size:17px; font-variant-numeric:tabular-nums}
.mf-row .v.c1{color:var(--c1)} .mf-row .v.c2{color:var(--c2)} .mf-row .v.c3{color:var(--c3)}
.mf-sub{display:flex; gap:4px; padding:12px 15px; align-items:flex-end; height:74px}
.mf-sub span{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-3)}
.mf-sub i{display:block; width:100%; background:var(--sc); border-radius:1px; min-height:2px}
.mf-stamp{position:absolute; top:auto; right:12px; bottom:10px; width:88px; color:var(--ink-2); opacity:.9}
.mf-note{padding:12px 15px; font-size:13px; line-height:1.75; color:var(--ink-2); border-top:1px dashed var(--line)}

/* ─── 清單／空狀態 ───────────────────────────────────────── */
.section-title{
  margin:26px 14px 10px; font-size:12px; letter-spacing:.2em; color:var(--ink-3);
  font-family:var(--font-mark); display:flex; align-items:center; gap:10px;
}
.section-title::after{content:""; flex:1; height:1px; background:var(--line-2)}
.row{
  display:grid; grid-template-columns:auto 1fr auto; gap:11px; align-items:center;
  width:100%; text-align:left; padding:13px 14px; border-bottom:1px solid var(--line-2);
  transition:background .18s;
}
.row:hover{background:var(--yard-2)}
.row .swatch{width:4px; height:34px; background:var(--lit); border-radius:99px}
.row-t{font-size:14.5px; line-height:1.55}
.row-m{font-family:var(--font-mark); font-size:11px; color:var(--ink-3); letter-spacing:.12em; margin-top:2px; display:block}
.row-x{font-family:var(--font-mark); font-size:12px; color:var(--ink-3)}
.empty{
  margin:14px; padding:30px 22px; text-align:center; color:var(--ink-2);
  border:1px dashed var(--line); border-radius:var(--r); font-size:14.5px; line-height:1.8;
}
.empty .mascot-dock{margin:0 auto 6px; width:76px; height:76px; opacity:.9}
.zzz{height:16px; font-family:var(--font-mark); font-size:13px; color:var(--ink-3); letter-spacing:.3em}
.zzz i{display:inline-block; animation:float 2.6s ease-in-out infinite; font-style:normal}
.zzz i:nth-child(2){animation-delay:.5s} .zzz i:nth-child(3){animation-delay:1s}

/* 申論卡 */
.essay{margin:0 14px 12px; border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.essay-h{display:flex; gap:10px; align-items:center; padding:12px 14px; background:var(--yard-2); font-size:12px; color:var(--ink-2)}
.essay-h .swatch{width:4px; height:20px; background:var(--lit); border-radius:99px}
.essay-b{padding:14px; font-size:15.5px; line-height:1.85; white-space:pre-line}
.steps{list-style:none; margin:0; padding:12px 14px; border-top:1px dashed var(--line); display:grid; gap:9px}
.steps li{display:grid; grid-template-columns:auto 1fr; gap:11px; font-size:14px; color:var(--ink-2); line-height:1.6}
.steps .n{font-family:var(--font-mark); font-size:11px; width:20px; height:20px; display:grid; place-items:center;
  border:1px solid var(--ink-3); border-radius:50%; color:var(--ink-3)}

/* ─── 設定 ───────────────────────────────────────────────── */
.set-row{display:flex; align-items:center; gap:12px; padding:14px var(--pad); border-bottom:1px solid var(--line-2); font-size:15px}
.set-row .lab{flex:1; min-width:0}
.set-row .sub{display:block; font-size:12.5px; color:var(--ink-3); line-height:1.55; margin-top:1px}
.seg{display:flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; flex:none}
.seg button{padding:8px 13px; font-size:13px; color:var(--ink-3); min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--yard)}
input[type=date]{font:inherit; font-size:14px; color:var(--ink); background:var(--yard-2);
  border:1px solid var(--line); border-radius:var(--r); padding:9px 11px; min-height:40px}

/* ─── 動作 ───────────────────────────────────────────────── */
@keyframes settle{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
.settle{animation:settle .44s var(--ease) both}
.berths .berth{animation:settle .5s var(--ease) both}
.berths .berth:nth-child(1){animation-delay:.03s}
.berths .berth:nth-child(2){animation-delay:.09s}
.berths .berth:nth-child(3){animation-delay:.15s}
.berths .berth:nth-child(4){animation-delay:.21s}

/* 吊櫃：起重機推車滑入 → 吊索放下 → 貨櫃落定 */
@keyframes trolleyIn{0%{transform:translateX(-180px)} 100%{transform:none}}
@keyframes cableDown{0%{transform:scaleY(.1)} 100%{transform:scaleY(1)}}
@keyframes craneIn{
  0%{opacity:0; transform:translateY(-24px) scaleY(.986)}
  64%{opacity:1; transform:translateY(3px) scaleY(1.004)}
  100%{opacity:1; transform:none}
}
.gantry .trolley{animation:trolleyIn .5s var(--ease) both}
.gantry .cable{animation:cableDown .34s var(--ease) .32s both}
.gantry .spreader{animation:craneIn .46s var(--ease) .34s both}
.crane{animation:craneIn .56s var(--ease) .3s both}
@keyframes lampSweep{0%{transform:scale(1)} 50%{transform:scale(1.55)} 100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0); opacity:.35} 50%{transform:translateY(-7px); opacity:1}}
@keyframes pop{0%{transform:scale(.6); opacity:0} 60%{transform:scale(1.08)} 100%{transform:scale(1); opacity:1}}
.pop{animation:pop .34s var(--ease) both}

/* 夥伴的呼吸與眨眼：週期刻意錯開 */
@keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)} 50%{transform:translateY(-1.4px) scaleY(1.014)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)} 95%,97%{transform:scaleY(.08)}}
@keyframes tailwag{0%,100%{transform:rotate(-13deg)} 50%{transform:rotate(15deg)}}
@keyframes hop{0%,100%{transform:translateY(0)} 26%{transform:translateY(-9px)} 52%{transform:translateY(0)} 66%{transform:translateY(-4px)}}
@keyframes tilt{0%,100%{transform:rotate(0)} 50%{transform:rotate(-8deg)}}
@keyframes shake{0%,100%{transform:rotate(0)} 25%{transform:rotate(4deg)} 75%{transform:rotate(-4deg)}}
@keyframes spin{0%,100%{transform:translateY(0) rotate(0)} 30%{transform:translateY(-13px) rotate(8deg)} 60%{transform:translateY(0) rotate(-4deg)}}
.m-body{animation:breathe 4.3s ease-in-out infinite; transform-origin:50% 100%}
.m-eye{animation:blink 5.7s ease-in-out infinite; transform-origin:center}
.m-tail{animation:tailwag 2.9s ease-in-out infinite; transform-origin:88% 78%}
.m-head{transform-origin:50% 76%}
[data-mood="happy"] .m-body{animation:hop .72s var(--ease) 2, breathe 4.3s ease-in-out infinite 1.44s}
[data-mood="happy"] .m-tail{animation-duration:.42s}
[data-mood="cheer"] .m-body{animation:spin .78s var(--ease) 3, breathe 4.3s ease-in-out infinite 2.34s}
[data-mood="cheer"] .m-tail{animation-duration:.32s}
[data-mood="think"] .m-head{animation:tilt 2.4s ease-in-out infinite}
[data-mood="think"] .m-tail{animation-duration:5s}
[data-mood="oops"] .m-head{animation:shake .5s ease-in-out 2}
[data-mood="oops"] .m-tail{animation-duration:6s}
[data-mood="sleep"] .m-eye{animation:none; transform:scaleY(.1)}
[data-mood="sleep"] .m-body{animation:breathe 6.4s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
  .xray,.stamp::after{display:none}
}

/* ─── 桌機 ───────────────────────────────────────────────── */
@media (min-width:768px){
  :root{--pad:22px}
  body{font-size:calc(17px * var(--zoom,1))}
  #app{padding-bottom:0}
  .companion{position:static; padding:0 22px; margin-top:24px}
  .dock{position:static; background:none; padding:16px 22px 56px}
  .bubble{opacity:1; transform:none}
  .berth{padding:22px 22px 20px}
  .berth-name{font-size:31px}
  .berth-mascot{width:96px; height:96px}
  .bay{padding:0 22px}
  .stem{font-size:19px; line-height:1.9}
  .countdown,.quota,.rankbar,.manifest{margin-left:22px; margin-right:22px}
  .section-title,.essay,.empty{margin-left:22px; margin-right:22px}
  .deck-grid,.deck-lab{padding-left:22px; padding-right:22px}
  .deck-lab{margin-left:0; margin-right:0}
  .row{padding-left:var(--pad); padding-right:var(--pad)}
  .mascot-dock{width:74px; height:74px}
  .stamp{width:148px; right:10%}
}

/* ─── 電腦版：驗櫃控制室 ───────────────────────────────────
   手機是手持終端機，一次一件事；電腦是控制室，左邊船席常駐、
   中間題目、右邊夥伴，不用在畫面之間來回跳。 */
#rail{display:none}
/* 控制室版面由 JS 掛在 <html> 上，不是純媒體查詢——因為這頁常常嵌在別人的視窗裡看，
   寬度到不了門檻，使用者在電腦上也只會看到手機版。所以要能手動強制。
     .ctrl  ＝ 兩欄（左：船席、功能、堆場現況／右：內容與夥伴）  自動門檻 820px
     .ctrl3 ＝ 三欄（堆場現況與夥伴一起搬到右欄）                自動門檻 1150px */
.ctrl{--pad:0px}
.ctrl #shell{
  display:grid; align-items:start; max-width:1460px; margin:0 auto;
  grid-template-columns:260px minmax(0,1fr);
  /* 左欄整條由 rail 佔滿（堆場現況掛在它裡面）。右欄由上到下：內容、夥伴、底欄。
     最後一列空著，專門吸收左欄多出來的高度，否則題目和動作按鈕之間會空一大塊 */
  grid-template-areas:"rail main" "rail side" "rail dock" "rail rest";
  grid-template-rows:min-content min-content min-content 1fr;
  gap:0 24px; padding:0 20px;
}
.ctrl #rail{display:block; grid-area:rail; padding:20px 0 28px}
.ctrl #app{grid-area:main; max-width:none; margin:0; padding:20px 0 0}
.ctrl #sidecol{display:block; grid-area:side; padding:0; margin:18px 0 0}
.ctrl .companion{position:static; padding:0; margin:0}
.ctrl .companion-inner{max-width:none}
.ctrl .dock{grid-area:dock; position:static; background:none; padding:18px 0 52px}
.ctrl .dock-inner{max-width:none}
.ctrl #side-panel{display:block; margin-top:22px}
.ctrl .mascot-dock{width:70px; height:70px}

/* 內容欄由 grid 給留白，元件不必再自己撐 */
.ctrl .countdown,.ctrl .quota,.ctrl .rankbar,.ctrl .manifest,.ctrl .section-title,
.ctrl .essay,.ctrl .empty,.ctrl .leavecard{margin-left:0; margin-right:0}
.ctrl .deck-grid,.ctrl .deck-lab{padding-left:0; padding-right:0}
.ctrl .deck-lab{margin-left:0}
.ctrl .row{padding-left:0; padding-right:0}
.ctrl .bay{padding:0}
.ctrl .berths{margin-top:0}
.ctrl .stem{font-size:18.5px}
/* 被強制開啟而視窗其實很窄時，左欄先縮，不要把題目擠成一條 */
@media (max-width:719px){
  .ctrl #shell{grid-template-columns:184px minmax(0,1fr); gap:0 16px; padding:0 14px}
  .ctrl .rail-berth b{font-size:12.5px}
  .ctrl .rail-kb{display:none}
}

/* 三欄：夥伴與堆場現況一起搬到右欄，中間只剩題目 */
.ctrl3 #shell{
  grid-template-columns:262px minmax(0,1fr) 330px;
  grid-template-areas:"rail main side" "rail dock side" "rail rest side";
  grid-template-rows:min-content min-content 1fr;
  gap:0 28px; padding:0 26px;
}
.ctrl3 #rail{position:sticky; top:76px}
.ctrl3 #sidecol{position:sticky; top:76px; margin:0; padding:20px 0 28px;
  max-height:calc(100vh - 96px); overflow:auto; scrollbar-width:thin}
.ctrl3 .companion-inner{flex-direction:column; align-items:stretch; gap:12px}
.ctrl3 #side-panel{margin-top:18px}
.ctrl3 .mascot-dock{width:84px; height:84px}
.ctrl3 .bubble{font-size:15px}
.ctrl3 .bubble::before{left:26px; top:-6px; bottom:auto; transform:rotate(45deg);
  border:1px solid var(--line); border-right:none; border-bottom:none}
.ctrl3 .stem{font-size:19.5px}

/* 左欄 */
.rail-h{font-family:var(--font-mark); font-size:11px; letter-spacing:.2em;
  color:var(--ink-3); margin:0 0 9px; display:flex; align-items:center; gap:9px}
.rail-h::after{content:""; flex:1; height:1px; background:var(--line-2)}
.rail-cd{display:flex; align-items:baseline; gap:8px; padding:11px 12px; border-radius:var(--r);
  background:var(--plate); color:var(--plate-ink); margin-bottom:12px}
.rail-cd b{font-family:var(--font-mark); font-size:25px; line-height:1}
.rail-cd span{font-size:11.5px; opacity:.75; line-height:1.4}
.rail-rank{display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:16px;
  border:1px solid var(--line); border-radius:var(--r)}
.rail-rank .rk-badge{width:28px; height:28px}
.rail-rank b{font-size:13.5px; display:block}
.rail-rank span{font-size:11px; color:var(--ink-3)}
.rail-berth{
  display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center;
  width:100%; text-align:left; padding:10px 12px; border-radius:var(--r);
  background:var(--c); color:var(--on); margin-bottom:6px; transition:filter .18s;
}
.rail-berth:hover:not([disabled]){filter:brightness(1.09)}
.rail-berth[disabled]{opacity:.5; cursor:default}
.rail-berth b{font-size:14.5px; font-weight:900; letter-spacing:.02em}
.rail-berth i{font-family:var(--font-mark); font-style:normal; font-size:11px; opacity:.92;
  display:block; margin-top:1px}
.rail-berth em{font-family:var(--font-mark); font-style:normal; font-size:15px; opacity:.95}
.rail-nav{display:grid; gap:1px; margin-top:6px}
.rail-nav button{display:flex; gap:10px; align-items:center; padding:9px 12px;
  border-radius:var(--r); font-size:14px; color:var(--ink-2); text-align:left}
.rail-nav button:hover{background:var(--yard-2); color:var(--ink)}
.rail-nav button[aria-current="true"]{background:var(--yard-3); color:var(--ink); font-weight:700}
.rail-nav svg{width:17px; height:17px; flex:none; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.rail-kb{margin-top:18px; font-size:11.5px; line-height:2.1; color:var(--ink-3)}
.rail-kb kbd{font-family:var(--font-mark); font-size:10.5px; border:1px solid var(--line);
  border-radius:3px; padding:1px 6px; margin-right:6px; color:var(--ink-2)}
/* ─── 抽驗定位 ───────────────────────────────────────────── */
.cal-card{margin:16px var(--pad); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--yard-2)}
.cal-h{display:flex; align-items:baseline; gap:10px; padding:13px 15px; border-bottom:1.5px solid var(--ink); flex-wrap:wrap}
.cal-h b{font-size:17px; font-weight:900; letter-spacing:.06em}
.cal-h .d{margin-left:auto; font-family:var(--font-mark); font-size:12px; color:var(--ink-2)}
.cal-b{padding:14px 15px 4px; font-size:14px; line-height:1.8; color:var(--ink-2)}
/* 全站慣例：em 是「加粗強調」，不是斜體。中文斜體只會變糊 */
.cal-card em, .cal-spec em, .cal-verdict em, .cal-legend em, .cal-ax em{
  font-style:normal; font-weight:700; color:var(--ink)}
.cal-spec{list-style:none; margin:0; padding:10px 15px 15px; display:grid; gap:8px; font-size:13.5px; color:var(--ink-2)}
.cal-spec li{display:grid; grid-template-columns:5em 1fr; gap:11px; line-height:1.62}
.cal-spec i{font-family:var(--font-mark); font-style:normal; font-size:10.5px; letter-spacing:.13em;
  color:var(--ink-3); padding-top:4px}

/* 進度：40 格貨櫃。作答期間不透露對錯，只透露走到哪裡 */
.cal-prog{display:flex; align-items:center; gap:11px; padding:0 var(--pad); margin:12px 0 0;
  font-family:var(--font-mark); font-size:11.5px; color:var(--ink-3); letter-spacing:.1em}
.cal-cells{flex:1; display:grid; grid-template-columns:repeat(20,1fr); gap:2px}
.cal-cells i{height:9px; background:var(--ink); opacity:.15; border-radius:1px; transition:opacity .25s}
.cal-cells i.on{opacity:.6}
.cal-cells i.now{opacity:1; background:var(--lit)}

/* 報告：四席橫條。刻度線畫在 7/10——單選拿七成，申論只要一半就能及格 */
.cal-bar{display:grid; grid-template-columns:5.4em 1fr 3.6em; align-items:center; gap:11px; padding:9px 15px; font-size:13.5px}
.cal-bar .nm{font-weight:700}
.cal-bar .tr{position:relative; height:16px; background:var(--yard-3); border-radius:2px}
.cal-bar .fl{position:absolute; top:0; bottom:0; left:0; background:var(--sc); border-radius:2px}
.cal-bar .tk{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); opacity:.55}
.cal-bar .vv{font-family:var(--font-mark); font-size:15px; text-align:right; font-variant-numeric:tabular-nums}
.cal-legend{padding:2px var(--pad) 13px; font-size:11.5px; color:var(--ink-3); line-height:1.72}
.cal-note{padding:13px 15px; font-size:13px; line-height:1.78; color:var(--ink-2); border-top:1px dashed var(--line)}

.cal-verdict{margin:14px var(--pad) 0; padding:12px 14px; border-left:3px solid var(--ink);
  background:var(--yard-3); font-size:13.5px; line-height:1.8; border-radius:0 var(--r) var(--r) 0}
/* 這個標籤坐在 --yard-3 上（比一般地面深），--ink-3 在白天只有 4.14:1，要用 --ink-2 */
.cal-verdict b{display:block; font-family:var(--font-mark); font-size:10.5px; letter-spacing:.16em;
  color:var(--ink-2); margin-bottom:3px}

.cal-ax{width:100%; border-collapse:collapse; font-size:13px}
.cal-ax th{font-family:var(--font-mark); font-size:10.5px; letter-spacing:.13em; color:var(--ink-3);
  text-align:left; font-weight:700; padding:7px var(--pad); border-bottom:1px solid var(--line)}
.cal-ax th.n, .cal-ax td.n{text-align:right}
.cal-ax td{padding:8px var(--pad); border-bottom:1px solid var(--line-2); color:var(--ink-2)}
.cal-ax td.n{font-family:var(--font-mark); font-variant-numeric:tabular-nums; color:var(--ink); white-space:nowrap}
.cal-ax .sw{display:inline-block; width:3px; height:12px; border-radius:99px; background:var(--sc);
  margin-right:9px; vertical-align:-1px}
/* ─── 電腦版右欄常駐面板 ─────────────────────────────────────
   手機的四個船席各帶一張 40 格貨櫃堆疊圖與一隻動物；電腦版把船席縮成左欄的細條，
   那兩樣就沒地方去了。右欄本來就空著 336px，把它們放回來。 */
.sp-h{font-family:var(--font-mark); font-size:11px; letter-spacing:.2em; color:var(--ink-3);
  margin:0 0 10px; display:flex; align-items:center; gap:9px}
.sp-h::after{content:""; flex:1; height:1px; background:var(--line-2)}
.sp-sub{display:grid; grid-template-columns:38px 1fr; gap:10px; align-items:start;
  padding:9px 0; border-bottom:1px solid var(--line-2)}
.sp-sub:last-of-type{border-bottom:none}
.sp-m{width:38px; height:38px; display:block}
.sp-t{min-width:0}
.sp-t b{display:block; font-size:13.5px; font-weight:700; line-height:1.35}
/* 只選直接子層：堆疊格子也是 i，被選到的話 currentColor 會被改成 --ink-3，
   塗裝色就消失了 */
.sp-t>i{display:block; font-family:var(--font-mark); font-style:normal; font-size:10.5px;
  letter-spacing:.08em; color:var(--ink-3); margin:1px 0 6px}
.sp-sub .stack{color:var(--lit); max-width:232px; margin-top:0}
.sp-sub .stack i{height:7px}

.sp-rank{display:flex; align-items:center; gap:10px; margin-top:14px; padding:11px 12px;
  border:1px solid var(--line); border-radius:var(--r)}
.sp-rank .rk-badge{width:30px; height:30px}
.sp-rank .rk-t b{font-size:13px}
.sp-rank .rk-t .sub{font-size:11px}

/* 抽驗作答中：右欄換成進度盤。只講「驗到哪裡」，一個字都不透露對錯 */
.sp-big{display:flex; align-items:baseline; gap:9px; padding:12px 13px; border-radius:var(--r);
  background:var(--plate); color:var(--plate-ink); margin-bottom:12px}
.sp-big b{font-family:var(--font-mark); font-size:29px; line-height:1}
.sp-big b span{font-size:16px; opacity:.55}
.sp-big>span{font-size:11.5px; opacity:.75}
.sp-row{display:flex; align-items:center; gap:9px; padding:7px 0; font-size:13px;
  border-bottom:1px solid var(--line-2)}
.sp-row .sw{width:3px; height:14px; border-radius:99px; background:var(--lit); flex:none}
.sp-row em{margin-left:auto; font-family:var(--font-mark); font-style:normal; font-size:13px;
  color:var(--ink-2); font-variant-numeric:tabular-nums}
.sp-note{margin-top:12px; font-size:11.5px; line-height:1.75; color:var(--ink-3)}
.sp-note em{font-style:normal; font-weight:700; color:var(--ink-2)}
/* ─── 搪膠公仔盲盒 ───────────────────────────────────────── */
.box-stage{display:grid; place-items:center; min-height:210px; padding:10px var(--pad) 0}
.box-in{width:150px; height:150px}
.box-in svg{width:100%; height:auto; display:block}
.box-in.shake{animation:boxShake .8s cubic-bezier(.36,.07,.19,.97) both}
@keyframes boxShake{
  0%,100%{transform:translateX(0) rotate(0)}
  10%,30%,50%{transform:translateX(-5px) rotate(-4deg)}
  20%,40%,60%{transform:translateX(5px) rotate(4deg)}
  75%{transform:translateY(-8px) scale(1.05)}
  90%{transform:translateY(2px) scale(.97)}
}
.fig-pop{width:172px; height:172px}
.fig-pop .fig-art{width:100%; height:100%; animation:figRise .62s var(--ease) both}
@keyframes figRise{
  0%{opacity:0; transform:translateY(26px) scale(.72)}
  62%{opacity:1; transform:translateY(-6px) scale(1.06)}
  100%{opacity:1; transform:none}
}
.fig-art{display:block}
.fig-art svg{width:100%; height:100%; display:block}
.fig-name{margin:6px var(--pad) 0; text-align:center; line-height:1.7}
.fig-name b{display:block; font-size:18px; font-weight:900; letter-spacing:.03em}
.fig-name span{display:block; font-size:12.5px; color:var(--ink-3)}
.fig-name .d{font-size:13px; color:var(--ink-2); margin-top:5px}
.fig-name .dupe{margin-top:10px; font-size:13px; color:var(--ink-2);
  border-top:1px dashed var(--line); padding-top:10px}
.fig-name em{font-style:normal; font-weight:700; color:var(--ink)}
.box-why{margin:8px var(--pad) 0; text-align:center; font-size:12.5px; color:var(--ink-3)}
.box-why em{font-style:normal; font-weight:700; color:var(--ink)}

.case-head{display:flex; align-items:baseline; gap:12px; padding:0 var(--pad) 12px; flex-wrap:wrap}
.case-head>span:first-child b{font-family:var(--font-mark); font-size:26px}
.case-head>span:first-child span{font-family:var(--font-mark); font-size:14px; color:var(--ink-3)}
.case-meta{margin-left:auto; display:flex; align-items:center; gap:10px;
  font-family:var(--font-mark); font-size:11.5px; color:var(--ink-3)}
.case-meta .chip{background:var(--plate); color:var(--plate-ink); padding:3px 9px; border-radius:99px; font-size:11px}

.case-row{padding:0 var(--pad) 14px}
.case-lab{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; margin-bottom:7px}
.case-lab .sw{width:4px; height:15px; border-radius:99px; background:var(--lit)}
.case-slots{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.slot{position:relative; border:1px solid var(--line-2); border-radius:var(--r);
  background:var(--yard-2); padding:6px 4px 5px; text-align:center; min-width:0}
.slot .fig-art{width:100%; aspect-ratio:1; margin:0 auto}
.slot i{display:block; font-style:normal; font-size:9.5px; line-height:1.35; color:var(--ink-3);
  margin-top:2px; overflow:hidden}
.slot u{position:absolute; top:3px; right:4px; text-decoration:none;
  font-family:var(--font-mark); font-size:9.5px; color:var(--ink-2)}
.slot.has{border-color:var(--line); background:var(--yard-3)}
.slot.has i{color:var(--ink-2)}
.slot.star{border-color:var(--gold-lit); box-shadow:inset 0 0 0 1px var(--gold-lit)}
/* ★ 是文字（要 4.5:1），--gold-lit 在白天只有 4.32。
   --warn-ink 本來就是為「深底上的警示字」準備的，兩個主題都夠 */
.slot.lock .lk{position:absolute; top:50%; left:50%; transform:translate(-50%,-60%);
  font-size:17px; color:var(--warn-ink)}
.slot.lock i{color:var(--ink-3); font-size:9px}
.craft-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:0 var(--pad)}
.slot.pick{cursor:pointer; width:100%}
.slot.pick:hover{background:var(--yard-3); border-color:var(--ink-3)}
@media (max-width:420px){ .craft-grid{grid-template-columns:repeat(3,1fr)} }
/* 自訂夥伴圖像 */
/* 自訂圖：三層。底盤（地）＋照片（角色）＋接地陰影。
   「很假」的三個成因分開治：
     ① 硬剪的邊 → 邊緣用遮罩淡出，沒有邊就不會毛
     ② 浮在半空 → 腳下加接地陰影，會跟著跳動縮放
     ③ 四張照片各有各的色溫 → 疊一層該科塗裝色的 color 混合，四隻才像同一組 */
.m-pic{width:100%; height:100%; position:relative; border-radius:50%; isolation:isolate}
.m-pic i{position:absolute; inset:0; z-index:2; display:block; border-radius:50%;
  background-repeat:no-repeat; background-position:center 88%; background-size:80%;
  filter:saturate(.92) contrast(1.05) brightness(1.02);
  transform-origin:50% 92%;
  animation:plushIdle 4.6s ease-in-out infinite;
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 70%, rgba(0,0,0,.35) 88%, transparent 97%);
  mask-image:radial-gradient(circle at 50% 50%, #000 70%, rgba(0,0,0,.35) 88%, transparent 97%)}
/* 色溫統一：只在圖上，不吃到底盤 */
.m-pic i::after{content:""; position:absolute; inset:0; background:var(--lit);
  mix-blend-mode:color; opacity:.13; pointer-events:none}
.m-pic.fill i{background-size:cover; background-position:center}
/* 接地陰影：讓它站在底盤上，而不是貼在上面 */
.m-pic::after{content:""; position:absolute; left:26%; right:26%; bottom:10%; height:6%;
  z-index:1; border-radius:50%; background:rgba(0,0,0,.30); filter:blur(3px);
  animation:plushShade 4.6s ease-in-out infinite}
/* 底盤一律用淺色，不跟著主題或色票走。
   原本色場上的底盤用 --{key}-on，在糖果色票裡那是深墨（因為色場是粉彩），
   底盤會變成一塊黑餅，照片整個沉進去。
   照片多半是中間調，淺底才穩——夜班模式下它會像一盞聚光燈，那正是要的效果。 */
.m-pic.plate{background:color-mix(in srgb, var(--lit) 11%, #FFFFFF);
  box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--lit) 55%, transparent),
             0 3px 8px rgba(0,0,0,.26)}
.m-pic.plate.on-livery{box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--lit) 42%, transparent),
             0 3px 10px rgba(0,0,0,.32)}
.m-pic:not(.plate) i{filter:saturate(.92) contrast(1.05) drop-shadow(0 3px 7px rgba(0,0,0,.30))}
.m-pic:not(.plate)::after{background:rgba(0,0,0,.22); bottom:6%}

/* 情緒：跟內建動物共用同一套詞彙（hop / spin / tilt / shake），
   但動的是圖，底盤不動——底盤是它站的地方 */
.m-pic[data-mood="happy"] i{animation:hop .72s var(--ease) 2, plushIdle 4.6s ease-in-out infinite 1.44s}
.m-pic[data-mood="cheer"] i{animation:spin .78s var(--ease) 3, plushIdle 4.6s ease-in-out infinite 2.34s}
.m-pic[data-mood="think"] i{animation:tilt 2.4s ease-in-out infinite}
.m-pic[data-mood="oops"]  i{animation:shake .5s ease-in-out 2, plushIdle 4.6s ease-in-out infinite 1s}
.m-pic[data-mood="sleep"] i{animation:plushIdle 7.6s ease-in-out infinite}
.m-pic[data-mood="happy"]::after,
.m-pic[data-mood="cheer"]::after{animation:plushShade .75s var(--ease) 2, plushShade 4.6s ease-in-out infinite 1.5s}
.m-pic[data-mood="sleep"]::after{animation-duration:7.6s}

/* 絨毛玩偶的待機：不是機械式的上下，是帶一點擠壓與側傾的軟晃 */
@keyframes plushIdle{
  0%,100%{transform:translateY(0) rotate(0) scale(1,1)}
  30%{transform:translateY(-2.2px) rotate(-1.3deg) scale(1.012,.988)}
  62%{transform:translateY(.6px) rotate(1deg) scale(.994,1.01)}
}
@keyframes plushShade{
  0%,100%{transform:scaleX(1); opacity:1}
  30%{transform:scaleX(.86); opacity:.62}
  62%{transform:scaleX(1.04); opacity:1}
}
/* 小尺寸（右欄面板 38px）：環線、陰影等比縮，否則整顆糊掉 */
.sp-m .m-pic.plate{box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--lit) 52%, transparent),
             0 2px 5px rgba(0,0,0,.24)}
.sp-m .m-pic i{background-size:84%}
.sp-m .m-pic::after{filter:blur(1.6px); height:7%}
.pic-row{display:flex; align-items:center; gap:12px; padding:11px var(--pad);
  border-bottom:1px solid var(--line-2)}
.pic-thumb{width:46px; height:46px; flex:none; border-radius:var(--r); background:var(--yard-3);
  background-size:contain; background-repeat:no-repeat; background-position:center;
  display:grid; place-items:center; overflow:hidden}
.pic-thumb .fig-art{width:100%; height:100%}
.pic-t{flex:1; min-width:0}
.pic-t b{display:block; font-size:14px}
.pic-t span{display:block; font-size:11.5px; color:var(--ink-3)}
.pic-btn{flex:none; display:flex; gap:6px}
.pic-btn button{border:1px solid var(--line); border-radius:var(--r); padding:0 12px;
  min-height:38px; font-size:12.5px; color:var(--ink-2)}
.pic-btn button:hover{color:var(--ink); border-color:var(--ink-3); background:var(--yard-2)}
.pic-btn button.armed{border-color:var(--ink); color:var(--ink); background:var(--yard-3); font-weight:700}

/* ─── 色票：糖果 ─────────────────────────────────────────────
   潮玩公仔的粉嫩暖色系。跟白天／夜班是兩個獨立的軸，可以並存。
   關鍵限制：塗裝色場變成淺粉彩，白字一定過不了 4.5:1，
   所以 --{key}-on 要換成同色相的深墨；而地面上的圖形用的 -lit
   仍然要自己夠深（≥3:1），不能直接用色場那支粉彩。 */
:root[data-palette="candy"]{
  --yard:#FBF2EA; --yard-2:#FFF9F4; --yard-3:#F1E0D3;
  --ink:#3F2E2A; --ink-2:#6A544C; --ink-3:#74594F;
  --line:rgba(63,46,42,.20); --line-2:rgba(63,46,42,.09);
  --plate:#3F2E2A; --plate-ink:#FFF3E8;
  --rib-d:rgba(90,60,50,.10); --rib-l:rgba(255,255,255,.30);
  --lamp-off:rgba(63,46,42,.15);
  --shadow:0 1px 2px rgba(120,80,70,.12), 0 8px 24px -8px rgba(120,80,70,.26);
  --shadow-lift:0 2px 4px rgba(120,80,70,.14), 0 18px 40px -12px rgba(120,80,70,.36);
  --ink-blend:multiply;

  --practice:#86C9A4; --practice-on:#17352A;
  --law:#97C6E4;      --law-on:#12303F;
  --tariff:#F2A9C1;   --tariff-on:#47182B;
  --english:#F5C58F;  --english-on:#462C11;
  --practice-lit:#2F9268; --law-lit:#2E7FAE; --tariff-lit:#CF4C82; --english-lit:#B5762A;

  /* c1/c3 會被當文字用（.hot-d、清冊數字），所以要壓到 4.5:1；
     c2 反過來要夠亮，因為它上面坐的是深墨 */
  --c1:#1F7A54; --c2:#C67A00; --c3:#B03A34;
  --c1-ink:#FFFFFF; --c2-ink:#1A1205; --c3-ink:#FFFFFF;
  --warn-ink:#8A5600; --neg-ink:#A8322C;
  --gold:#8A6A12; --gold-lit:#8A6A12;
}
@media (prefers-color-scheme:dark){ :root[data-palette="candy"]:not([data-theme="light"]){
  --yard:#2A2126; --yard-2:#342A30; --yard-3:#40343B;
  --ink:#F7E9DE; --ink-2:#CDB7AB; --ink-3:#B29C90;
  --line:rgba(247,233,222,.17); --line-2:rgba(247,233,222,.08);
  --plate:#F7E9DE; --plate-ink:#2A2126;
  --rib-d:rgba(0,0,0,.30); --rib-l:rgba(255,255,255,.10);
  --lamp-off:rgba(247,233,222,.14);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -10px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 22px 48px -14px rgba(0,0,0,.8);
  --ink-blend:screen;
  --practice-lit:#6FD3A6; --law-lit:#7FC2EC; --tariff-lit:#FF9EC0; --english-lit:#F5C075;
  --c1:#4FD39C; --c2:#F0B45C; --c3:#FF8080;
  --c1-ink:#06291D; --c2-ink:#1A1205; --c3-ink:#300C0C;
  --warn-ink:#F0B45C; --neg-ink:#FF9E9E;
  --gold:#D4A82A; --gold-lit:#E8C24A;
}}
:root[data-palette="candy"][data-theme="dark"]{
  --yard:#2A2126; --yard-2:#342A30; --yard-3:#40343B;
  --ink:#F7E9DE; --ink-2:#CDB7AB; --ink-3:#B29C90;

/* 糖果色票：邊角放軟，工業感的直角收掉 */
:root[data-palette="candy"]{ --r:12px }
:root[data-palette="candy"] .berth{border-radius:0}
:root[data-palette="candy"] .opt{border-radius:12px}
:root[data-palette="candy"] .stack i{border-radius:2px}
/* 裁切 */
.crop-wrap{position:relative; margin:0 var(--pad); border-radius:var(--r); overflow:hidden;
  background:var(--yard-3); touch-action:none; user-select:none; line-height:0}
.crop-wrap img{width:100%; height:auto; display:block; pointer-events:none}
.crop-shade{position:absolute; box-shadow:0 0 0 9999px rgba(0,0,0,.5); pointer-events:none; border-radius:2px}
.crop-box{position:absolute; border:2px solid #fff; border-radius:2px; cursor:move;
  box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.crop-h{position:absolute; right:-11px; bottom:-11px; width:26px; height:26px; border-radius:50%;
  background:#fff; border:2px solid rgba(0,0,0,.45); cursor:nwse-resize; touch-action:none}
/* 裁切的選項與預覽 */
.crop-opt{display:flex; align-items:center; gap:12px; padding:10px var(--pad) 0}
.crop-opt .lab{flex:1; font-size:14px}
.crop-prev{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 var(--pad)}
.crop-prev .pv{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; text-align:center}
.crop-prev .pv i{display:block; height:112px; background-size:contain;
  background-repeat:no-repeat; background-position:center;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.30))}
.crop-prev .pv b{display:block; font-family:var(--font-mark); font-size:10.5px; letter-spacing:.12em;
  padding:5px 0 6px; color:var(--ink-3); background:var(--yard-2)}
.crop-prev .pv-livery i{background-color:var(--c)}
.crop-prev .pv-yard i{background-color:var(--yard)}
/* 進度備份 */
.bk-paste{padding:0 var(--pad); display:grid; gap:8px}
.bk-paste textarea{width:100%; min-height:88px; resize:vertical; font-family:ui-monospace,monospace;
  font-size:11.5px; line-height:1.5; padding:10px 11px; color:var(--ink);
  background:var(--yard-2); border:1px solid var(--line); border-radius:var(--r)}
.bk-paste .btn{min-height:42px}
/* 雲端同步 */
.cl-form{display:grid; gap:12px; padding:4px var(--pad) 0}
.cl-form label{display:grid; gap:5px; font-size:13px; color:var(--ink-2)}
.cl-form input,.cl-form textarea{width:100%; font-size:13px; padding:10px 11px; color:var(--ink);
  background:var(--yard-2); border:1px solid var(--line); border-radius:var(--r);
  font-family:ui-monospace,monospace}
.cl-form textarea{resize:vertical; line-height:1.5}
.cl-form .btn{min-height:44px}
.wordmark{cursor:pointer; border:none; background:none; padding:0}
.wordmark:hover b{text-decoration:underline; text-underline-offset:3px}
.hidden{display:none !important}
</style>

ithin 72 hours, by air transport, also within 36 hours"],[1],5,0],[115,3,0,34,"The bonding operations of Science Parks(A), Bonded Warehouse(B) and Logistics Center(C) were supervised by which government agency?",["A: National Science and Technology Council, B: Ministry of Finance, C: Ministry of Finance","A: Ministry of Finance, B: Ministry of Finance, C: Ministry of Finance","A: National Science and Technol ogy Council, B: Ministry of Finance, C: National Science and Technology Council","A: Ministry of Finance, B: National Science and Technology Council, C: Ministry of Finance"],[0],6,0],[115,3,0,35,"What preferential measures can Customs adopt for goods imported by a duty-payer with AEOS status?",["Goods with a declared Customs Value less than NTD 10 million may be released without documentation examination.","Goods with a declared Customs Value more than NTD 10 million may be released without both documentation examination and physical inspection.","Goods with a declared Customs Value less than NTD 100 million may be released without documentation examination.","Goods with a declared Customs Value more than NTD 100 million may be released without both documentation examination and physical inspection."],[3],6,0],[115,3,0,36,"Which government agency is responsible for the “Act for the Establishment and Management of Free Trade Zones” and the “Regulations Governing Customs Clearance for Goods in Free Trade Zones”?",["The first is the Ministry of Foreign Affairs and the second is the Ministry of Finance.","The first is the Ministry of Economics and the second is the Ministry of Finance.","The first is the Ministry of Transportation and Communications and the second is the Ministry of Finance.","The first is the Ministry of Finance and the second is also the Ministry of Finance."],[2],6,0],[115,3,0,37,"What is the term commonly used to refer to the International Convention on the simplification and harmonization of customs procedures, which was adopted by the Customs const NOTES = [{"id":"gir-1","deck":"解釋準則","subject":"tariff","title":"準則一","sub":"法定義務原則","tag":"90% 以上貨品適用","body":"類、章及分章的標題僅供查考。貨品分類的核定，必須完全依照稅則號別所列的名稱（節）及相關的「類註」「章註」來決定。","note":"文字條款有最高法律效力。章註或節名已經明確定義的，就直接定案，不能跳過章註去看後面的準則。","match":["準則一","類註","章註","標題僅供查考"]},{"id":"gir-2","deck":"解釋準則","subject":"tariff","title":"準則二","sub":"不完整、未組合及混合物","tag":"甲：未完成品／乙：混合物","body":"（甲）不完整品在進口時已具備完整品的主要特性，即按完整品歸類；未組合或拆散的零件組合也直接歸入完整品稅則。\n（乙）稅則所列的材料或物質，包含該物質與其他材料的混合或合成物。","note":"未裝輪子的腳踏車仍歸腳踏車。整套拆散待組裝的家具，歸完成品。由多種材料構成而看似符合兩個以上稅則的，要往準則三走。","match":["準則二","未組合","拆散","不完整","混合物","主要特性"]},{"id":"gir-3","deck":"解釋準則","subject":"tariff","title":"準則三","sub":"多種稅則重疊時的評估順序","tag":"甲→乙→丙，不可跳號","body":"（甲）具體描述優先：說明較具體明確者，優先於一般性說明。\n（乙）主要特徵原則：混合物、組合物或零售成套貨物，依構成實質主要特徵的材料或組件分類。\n（丙）從後歸類：無法以甲、乙分類時，歸入可考慮的稅則號別中字面位列最後者。","note":"薄荷口味口香糖歸「口香糖」而非「食物調製品」（甲）。皮帶＋錢包禮盒，皮帶為主要價值與體積來源則整套依皮帶歸類（乙）。","match":["準則三","具體","主要特徵","從後歸類","位列最後","成套"]},{"id":"gir-4","deck":"解釋準則","subject":"tariff","title":"準則四","sub":"性質最類似原則","tag":"實務上極少使用","body":"貨品無法依準則一至三歸類時，歸入與該貨品性質最類似的貨品稅則。","note":"很少用到，因為多數章節都設有「未列名」的平衡節（例如第 2106 節未列名食物調製品），新興產品通常直接進平衡節。","match":["準則四","最類似","平衡節","未列名"]},{"id":"gir-5","deck":"解釋準則","subject":"tariff","title":"準則五","sub":"容器與包裝材料","tag":"甲：特定容器／乙：包裝材料","body":"（甲）照相機盒、樂器盒、槍盒等特定容器，若為特定物品設計、適合長期使用、與所裝物品同時進口且正常同時出售，與內容物歸入同一稅則。\n（乙）普通外包裝材料或紙箱，與所裝貨物一併歸類。","note":"例外要記牢：容器本身構成整件貨物主要特質的（純金珠寶盒）要分開申報；明顯適合重複使用的包裝（工業用鋼製液化瓦斯鋼瓶）需獨立歸類。","match":["準則五","容器","包裝","盒"]},{"id":"gir-6","deck":"解釋準則","subject":"tariff","title":"準則六","sub":"子目（目）歸類原則","tag":"只比同一層次","body":"準則一至五所訂的規則，在同一節底下的子目（更詳細的 5、6 位碼）分類時同樣適用。","note":"比較子目時只能在「同一級距」之間比較——一級子目不能拿去跟二級子目比，層級邏輯要一致。這是申論常考的細節。","match":["準則六","子目","目別","同一層次","相同層次"]},{"id":"decl-g1","deck":"報單類別","subject":"practice","title":"G1","sub":"外貨進口","tag":"一般貿易進口","body":"企業或個人從國外購買商品進口至台灣，直接進入一般國內市場的貨物。完稅價格較高（如超過新臺幣 2,000 元）或有特殊輸入規定者走正式報關。","note":"應納稅費：進口關稅（完稅價格 × 稅率）、營業稅 5%（基準＝完稅價格＋關稅＋貨物稅＋菸酒稅）、推廣貿易服務費（完稅價格 × 0.04%）、貨物稅（視商品）。\n申報期限：進口日翌日起 15 日內；海運可在船舶抵達前 5 至 /* 縮圖：原圖直接存會吃掉幾 MB，配額一滿連作答紀錄都寫不進去。
   先降到長邊 256，webp 存不了就退回 png（兩者都保留透明背景）。 */
function readPic(file, cb){
  if(!file || !/^image\//.test(file.type)) return cb(null, '那不是圖片檔。');
  if(file.size > 12*1024*1024) return cb(null, '檔案太大（超過 12MB），換一張小一點的。');
  const fr = new FileReader();
  fr.onerror = ()=>cb(null, '讀不到這個檔案。');
  fr.onload = ()=>{
    const im = new Image();
    im.onerror = ()=>cb(null, '這個圖片格式瀏覽器打不開。');
    im.onload = ()=>{
      const r = Math.min(PIC_WORK/im.width, PIC_WORK/im.height, 1);
      const w = Math.max(1, Math.round(im.width*r)), h = Math.max(1, Math.round(im.height*r));
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h);
      let out = null;
      try{ const t = cv.toDataURL('image/webp', .85);
           if(t.indexOf('data:image/webp')===0) out = t; }catch(e){}
      if(!out){ try{ out = cv.toDataURL('image/png'); }catch(e){ return cb(null, '這張圖轉不出來。'); } }
      cb(out, null);
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function setPic(key, data, transparent){
  const prev = PICS[key];
  if(data) PICS[key] = {d:data, t:!!transparent}; else delete PICS[key];
  if(!savePics()){
    if(prev) PICS[key] = prev; else delete PICS[key];
    savePics();
    return false;
  }
  return true;
}
const picBytes = ()=>Object.values(PICS).reduce((a,v)=>a+(v.d?v.d.length:0),0);

/* 截圖多半只進剪貼簿、不落地成檔案，而 <input type=file> 只吃檔案。
   所以直接支援貼上：先試著讀剪貼簿（一鍵完成），讀不到再退回 Ctrl+V。 */
let PASTE_TARGET = null, PASTE_HINT = false;
function armPaste(key){
  PASTE_TARGET = key; PASTE_HINT = false;
  const fallback = ()=>{ PASTE_HINT = true; viewSettings(); };
  if(navigator.clipboard && navigator.clipboard.read){
    navigator.clipboard.read().then(items=>{
      for(const it of items){
        const t = (it.types||[]).find(x=>x.indexOf('image/')===0);
        if(t) return it.getType(t).then(b=>usePasted(new File([b],'paste',{type:t})));
      }
      fallback();
    }).catch(fallback);
  } else fallback();
}
function usePasted(file){
  const key = PASTE_TARGET; if(!key) return;
  readPic(file, (data, err)=>{
    if(!data){ alert(err || '剪貼簿裡那個東西不是圖片。'); return; }
    if(!setPic(key, data)){
      alert('瀏覽器的儲存空間不夠，這張圖沒存進去。' + '你的作答紀錄沒有受影響。'
            + '先移除一兩張已放的圖，或換一張更小的。');
      return;
    }
    PASTE_TARGET = null; PASTE_HINT = false;
    SFX.done(); viewSettings();
  });
}
addEventListener('paste', e=>{
  if(!PASTE_TARGET) return;
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(let i=0;i<items.length;i++){
    if(items[i].type && items[i].type.indexOf('image/')===0){
      const f = items[i].getAsFile();
      if(f){ e.preventDefault(); usePasted(f); return; }
    }
  }
});

/* ─── 從圖片取塗裝色 ─────────────────────────────────────────
   使用者放了自己的公仔照，希望整個介面的顏色跟著那幾隻走。
   每一科抽出該張圖的主色，當成那個船席的塗裝色。

   抽色不能只取平均——平均會得到一坨爛泥。作法是先丟掉太黑、太白、
   太灰的像素（背景與陰影都在那裡），剩下的按色相分桶，取最大那桶的中位數。

   抽出來的顏色不能直接用：
     · 色場上的字要 4.5:1 → 白字或深墨二選一，算過才知道
     · 地面上的圖形（堆疊格、色條）要 3:1 → 原色多半不夠，得往深或淺推
   兩個主題的地面色不同，所以換主題時要重算。 */
function hexRGB(h){ h=String(h).replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function rgbHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function relLum(c){ const f=c.map(v=>{v/=255; return v<=.03928? v/12.92 : Math.pow((v+.055)/1.055,2.4);});
  return .2126*f[0]+.7152*f[1]+.0722*f[2]; }
function cRatio(a,b){ const l1=relLum(a), l2=relLum(b); return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05); }
/* 坐在這個顏色上的字：白的與深墨的，挑對比高的那個 */
function inkFor(hex){
  const bg=hexRGB(hex), w=[255,255,255], d=[26,19,12];
  return cRatio(w,bg) >= cRatio(d,bg) ? '#FFFFFF' : '#1A130C';
}
/* 把顏色往深或往淺推，直到對背景達到目標對比。推不到就回最接近的那個 */
function fitContrast(hex, bgHex, target){
  const bg=hexRGB(bgHex), base=hexRGB(hex);
  if(cRatio(base,bg) >= target) return hex;
  const darkBG = relLum(bg) < 0.4;              // 深色地面 → 顏色要變亮
  let best=hex, bestR=cRatio(base,bg);
  for(let i=1;i<=20;i++){
    const t=i/20;
    const c = darkBG
      ? base.map(v => v + (255-v)*t)            // 往白推
      : base.map(v => v * (1-t));               // 往黑推
    const r = cRatio(c,bg);
    if(r>bestR){ bestR=r; best=rgbHex(c[0],c[1],c[2]); }
    if(r>=target) return rgbHex(c[0],c[1],c[2]);
  }
  return best;
}
/* 主色：丟掉太黑太白太灰的像素，按色相分桶，取最大那桶的中位數 */
function dominantColor(src){
  return new Promise(res=>{
    const im=new Image();
    im.onerror=()=>res(null);
    im.onload=()=>{
      try{
        const N=56, cv=document.createElement('canvas'); cv.width=cv.height=N;
        const cx=cv.getContext('2d',{willReadFrequently:true});
        cx.drawImage(im,0,0,N,N);
        const d=cx.getImageData(0,0,N,N).data, buckets={};
        for(let i=0;i<d.length;i+=4){
          if(d[i+3] < 200) continue;                       // 透明的是背景
          const r=d[i], g=d[i+1], b=d[i+2];
          const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
          const l=(mx+mn)/510;
          if(l<0.13 || l>0.93) continue;                   // 太黑太白：陰影與反光
          if(mx-mn < 26) continue;                         // 太灰：多半是背景
          let h;
          if(mx===r)      h=((g-b)/(mx-mn)+6)%6;
          else if(mx===g) h=(b-r)/(mx-mn)+2;
          else            h=(r-g)/(mx-mn)+4;
          const k=Math.round(h*60/14);                     // 約 26 個色相桶
          (buckets[k]=buckets[k]||[]).push([r,g,b]);
        }
        const all=Object.values(buckets).sort((a,b)=>b.length-a.length);
        const best=all[0];
        if(!best || best.length<10) return res(null);
        const med=i=>{ const v=best.map(p=>p[i]).sort((a,b)=>a-b); return v[v.length>>1]; };
        res(rgbHex(med(0),med(1),med(2)));
      }catch(e){ res(null); }
    };
    im.src=src;
  });
}
/* 換圖之後把主色算好存起來，不要每次開啟都重算 */
async function refreshPicColor(key){
  S.picColor = S.picColor || {};
  if(!PICS[key]){ delete S.picColor[key]; save(); return null; }
  const c = await dominantColor(picSrc(key));
  if(c){ S.picColor[key]=c; save(); }
  return c;
}
async function refreshAllPicColors(){
  for(const s of SUBJECTS) await refreshPicColor(s.key);
  applyPrefs();
}
/* 套用：沒有圖的科目就用內建塗裝色 */
function applyPicPalette(){
  const r=document.documentElement;
  SUBJECTS.forEach(s=>{
    ['','-on','-lit'].forEach(suf=>r.style.removeProperty('--'+s.key+suf));
  });
  if(S.palette!=='pic') return;
  const cs=getComputedStyle(r);
  const yard=(cs.getPropertyValue('--yard')||'#E4E1D9').trim();
  SUBJECTS.forEach(s=>{
    const base=(S.picColor||{})[s.key];
    if(!base) return;                                    // 沒圖就維持內建色
    r.style.setProperty('--'+s.key, base);
    r.style.setProperty('--'+s.key+'-on', inkFor(base));
    r.style.setProperty('--'+s.key+'-lit', fitContrast(base, yard, 3.2));
  });
}

/* 間隔複習：答錯歸零，答對往上升一格，間隔越拉越長。
   間隔要配合「保留區間」——考試在約 340 天後，研究指出最佳間隔約落在
   保留區間的 10–20%，所以尾端必須拉到數十天，前段 0/1/3/7 天太密。
   另一個約束是配額：340 天 × 每日 20 題 = 6,800 題次，扣掉初見 1,280 題，
   平均每題只分得到約 4 次複習。這組數字讓全對的題在考前出現 5 次，剛好吻合。 */
const BOX_DAYS = [0, 3, 12, 40, 120, 240];
function dueAt(box){
  const t = Date.now() + BOX_DAYS[Math.min(box, BOX_DAYS.length - 1)] * 864e5;
  const exam = S.examDate ? new Date(S.examDate+'T00:00:00').getTime() : 0;
  // 排到考試之後等於沒排，夾到考前一週
  return exam ? Math.min(t, exam - 7*864e5) : t;
}

  if(S.leaveMonth!==mo){ S.leaveMonth=mo; S.leaveLeft=2; }   // 每月補兩張請假卡

  if(S.lastActive===yesterday()){
    S.streak++;
  } else if(S.lastActive && S.leaveLeft>0 && gapDays(S.lastActive,t)<=3){
    // 中間漏了一兩天：用一張請假卡把連續天數接回去。生病或加班不該前功盡棄。
    S.leaveLeft--; S.streak++; S.usedLeave=t; S.leaveGap=S.lastActive;
  } else {
    if(S.lastActive) S.brokeOn=t;      // 真的斷了：那天要說一句話，不能靜默歸零
    S.streak=1;
  }
  S.lastActive=t;
  if(S.streak>S.best) S.best=S.streak;
  boxOnStreak();
  save();
}
function gapDays(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5); }

/* 陷阱診斷 v2。所有判斷都從選項文字算出來，不是編的。
   關鍵是前置閘門：兩個選項要先「長得是同一句話的變體」，才允許指名差異。
   沒有閘門的規則會製造錯誤歸因——例如兩句話講的是完全不同的事，
   只因一句提到「海關」、一句提到「主管機關」，就被說成權責陷阱。
   那比不講更糟，會讓使用者學到錯的歸因。實測約 77% 的情況回傳空字串。 */
function ratio(a, b){                       // 字元 bigram 相似度
  if(a===b) return 1;
  if(!a || !b) return 0;
  const g = s => { const m=new Map();
    for(let i=0;i<s.length-1;i++){ const k=s.slice(i,i+2); m.set(k,(m.get(k)||0)+1); }
    return m; };
  const A=g(a), B=g(b); let hit=0, tot=0;
  A.forEach((v,k)=>{ hit+=Math.min(v, B.get(k)||0); tot+=v; });
  B.forEach(v=>tot+=v);
  return tot ? 2*hit/tot : (a.length===b.length ? 1 : 0);
}
const comSuf=(a,b)=>{let n=0;while(n<Math.min(a.length,b.length)&&a[a.length-1-n]===b[b.length-1-n])n++;return n;};
const comPre=(a,b)=>{let n=0;while(n<Math.min(a.length,b.length)&&a[n]===b[n])n++;return n;};

const FAMILIES = [
  ['時間單位', ['工作日','日曆日','曆日','個月','小時','日','月','年','週'], false,
    (a,b)=>`你答的是 <em>${a}</em>，正解是 <em>${b}</em>。數字對了、單位錯了——這種題背的時候要連單位一起背。`],

    (a,b)=>`你選的機關是 <em>${a}</em>，正解是 <em>${b}</em>。權責切得很細，看清楚是誰。`]

const MARK_WORDS = [...new Set(FAMILIES.reduce((a,f)=>a.concat(f[1]),[]))].sort((a,b)=>b.length-a.length);
const RE_MARKW = new RegExp(MARK_WORDS.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
const RE_NUMW = /\d+(?:\.\d+)?/g;
const RE_PUNW = /[\s，。、；：（）()「」.,%％]/g;
const RE_NEGW = /不得|不能|不可|不予|不需|不必|無須|毋須|禁止|非|未|無/g;
const SEPW = /[；;]/, ONEWORDW = /^[A-Za-z][A-Za-z\-']{2,}$/;

const _res = t => t.replace(RE_MARKW,'').replace(RE_NUMW,'').replace(RE_PUNW,'');
// 去重：同一個詞在句中出現兩次，不該講成「海關、海關」
const _seq = (t,ws) => [...new Set((t.match(RE_MARKW)||[]).filter(w=>ws.indexOf(w)>=0))];
const _num = t => t.match(RE_NUMW)||[];

/* diagFull 回傳 {tag, msg}：tag 給抽驗報告分族群統計，msg 給泡泡。
   兩邊必須用同一套規則，否則報告會說出跟當下引導不一樣的話。 */
function diagnose(pickedTxt, rightTxt, q){ return diagFull(pickedTxt, rightTxt, q).msg; }
const NODIAG = {tag:'', msg:''};
function diagFull(pickedTxt, rightTxt, q){
  const p=String(pickedTxt||''), r=String(rightTxt||'');
  if(!p || !r) return NODIAG;

  // 多欄位題（用分號切格）：資訊量最高，先判。它能分辨「全錯」與「只錯一格」
  const sp=p.split(SEPW), sr=r.split(SEPW);
  if(sp.length>1 && sp.length===sr.length){
    const norm=s=>s.replace(RE_PUNW,'');
    const ok=[], bad=[];
    for(let i=0;i<sp.length;i++) (norm(sp[i])===norm(sr[i]) ? ok : bad).push(i+1);
    if(ok.length && bad.length)
      return {tag:'多欄位', ok:ok.length, fields:sp.length,
        msg:`這題有 <em>${sp.length}</em> 格答案，你第 <em>${ok.join('、')}</em> 格是對的，錯在第 <em>${bad.join('、')}</em> 格。這種題不是全錯——回去只補那一格。`};
  }

  const ra=_res(p), rb=_res(r);
  const tight = ra===rb;                                        // 差異只在標記詞或數字
  const loose = !tight && ra.length>=6 && rb.length>=6 && ratio(ra,rb)>=0.9;

  if(tight || loose){
    for(let k=0;k<FAMILIES.length;k++){
      const ws=FAMILIES[k][1], allowEmpty=FAMILIES[k][2], say=FAMILIES[k][3];
      const a=_seq(p,ws), b=_seq(r,ws);
      if(a.join()===b.join()) continue;
      if(!allowEmpty && (!a.length || !b.length)) continue;   // 講不出「正解是什麼」就別講
      return {tag:FAMILIES[k][0], msg:say(a.join('、'), b.join('、'))};
    }
  }
  // 純數字差異只准走嚴格閘門：放寬會把「棉／絲」的差異誤報成節號差異
  if(tight){
    const na=_num(p), nb=_num(r);
    if(na.join()!==nb.join()){
      // 整串數字念出來看不出差在哪（「4、49、2、1、2、500」），只講不同的那幾個
      if(na.length===nb.length){
        // 同一組數字差異出現兩次（「1、1 → 5、5」）只講一次就好
        const da=[], db=[], seenPair=new Set();
        for(let i=0;i<na.length;i++){
          if(na[i]===nb[i]) continue;
          const key=na[i]+'>'+nb[i];
          if(seenPair.has(key)) continue;
          seenPair.add(key); da.push(na[i]); db.push(nb[i]);
        }
        if(da.length && da.length<=2)
          return {tag:'數字', msg:`你答的是 <em>${da.join('、')}</em>，正解是 <em>${db.join('、')}</em>——除了這個數字，兩個選項一字不差。這種題只有記得或不記得。`};
      }
      return {tag:'數字', msg:'這兩個選項除了數字之外一字不差，差別就在數字本身。這種題沒有推理空間，回去把正解的數字記牢。'};
    }
  }
  // 否定不對稱
  const nega=(p.match(RE_NEGW)||[]).join(), negb=(r.match(RE_NEGW)||[]).join();
  if(nega!==negb){
    const xa=p.replace(RE_NEGW,'').replace(RE_NUMW,'').replace(RE_PUNW,'');
    const xb=r.replace(RE_NEGW,'').replace(RE_NUMW,'').replace(RE_PUNW,'');
    if(xa.length>=4 && xb.length>=4 && ratio(xa,xb)>=0.92)
      return {tag:'否定', msg:`兩句話其他部分一模一樣，只有一個 <em>${(nega||negb).slice(0,2)}</em> 的差別。這種題不是考觀念，是考你有沒有把整句讀完。`};
  }
  // 英文：四個選項都必須是單一英文字，否則四個都以 "the " 開頭會被誤判成同字根
  if(q && q.options){
    const o=q.options.map(s=>String(s).trim());
    if(o.every(x=>ONEWORDW.test(x))){
      const suf=Math.min.apply(null, o.slice(1).map(x=>comSuf(o[0],x)));
      const pre=Math.min.apply(null, o.slice(1).map(x=>comPre(o[0],x)));
      if(suf>=4) return {tag:'形近字', msg:`四個選項都以 <em>-${o[0].slice(-suf)}</em> 結尾，長得幾乎一樣。這種題考的是前面那幾個字母，分開記。`};
      if(pre>=4) return {tag:'形近字', msg:`四個選項都從 <em>${o[0].slice(0,pre)}-</em> 開始。字根相同、字尾決定意思——把它們各造一個句子。`};
      if(ratio(p.toLowerCase(), r.toLowerCase())>=0.75)
        return {tag:'形近字', msg:`<em>${p}</em> 和 <em>${r}</em> 只差幾個字母，意思差很多。這組請一起背，不要分開背。`};
    }
  }
  // 細節陷阱（最後的 fallback）
  if(ra.length>=6 && rb.length>=6 && ratio(ra,rb)>=0.8)
    return {tag:'細節', msg:'這兩個選項只差幾個字。出題人就是在賭你讀太快——回去逐字比一次。'};

  return NODIAG;   // 判不出來就不講
}

let AC=null;
function tone(seq){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    seq.forEach(([f,t,d,type,g])=>{
      const o=AC.createOscillator(), gn=AC.createGain(), t0=AC.currentTime+t;
      o.type=type||'triangle'; o.frequency.setValueAtTime(f,t0);
      gn.gain.setValueAtTime(0,t0);
      gn.gain.linearRampToValueAtTime(g||.16,t0+.012);
      gn.gain.exponentialRampToValueAtTime(.0001,t0+d);
      o.connect(gn).connect(AC.destination); o.start(t0); o.stop(t0+d+.02);
    });
  }catch(e){}
}

const LAW_RE = /(關稅法|海關緝私條例|貿易法|海關進口稅則|加值型及非加值型營業稅法|臺灣地區與大陸地區人民關係條例|[一-龥]{2,14}(?:辦法|準則|條例|規則|標準|要點|手冊))(\s*第\s*\d+(?:\s*之\s*\d+)?\s*條(?:\s*之\s*\d+)?)?/g;

  const seen=new Set(), out=[];
  let m; LAW_RE.lastIndex=0;
  while((m=LAW_RE.exec(q.stem))!==null){
    const s=(m[1]+(m[2]||'')).replace(/\s+/g,'');
    if(!seen.has(s)){ seen.add(s); out.push(s); }
  }
  return out.slice(0,4);
}
/* 知識卡配對：先比關鍵詞命中數，再退回同科的通則卡 */
function matchNote(q){
  const hay = q.stem + ' ' + q.options.join(' ');
  let best=null, bestHits=0;
  for(const n of NOTES){
    let hits=0;
    for(const k of n.match) if(hay.indexOf(k)>=0) hits++;
    if(hits>bestHits){ bestHits=hits; best=n; }
  }
  if(best) return best;
  return NOTES.find(n=>n.subject===q.subjectKey && n.deck==='高頻考點') || null;
}

const MARK_RE = new RegExp(
  '((?:關稅法|海關緝私條例|貿易法|海關進口稅則|[一-龥]{2,12}(?:辦法|準則|條例|規則|標準))?' +

  '|何者錯誤|何者為非|何者不正確|何者有誤|何者為誤|何者錯|何者非|何者不[一-龥]{0,3}' +
  '|下列何者不[一-龥]{0,3}|非屬|不適用|不包括|錯誤者' +
  '|\\d+(?:\\.\\d+)?\\s*(?:日|年|個月|小時|分鐘|萬元|億元|元|公斤|公噸|噸|倍|次|％|%)' +
  ')', 'g');
function markStem(s){
  return esc(s).replace(MARK_RE, m =>
      /條$|條第\s*\d+\s*項$/.test(m) ? '<b class="mk-law">'+m+'</b>'
    : /^\d/.test(m)                  ? '<b class="mk-num">'+m+'</b>'

  let done=0, hold=0, pending=0, pass=0;
  const cells=new Array(40).fill(0);
  const per=Math.max(1, Math.ceil(list.length/40));   // 格位圖固定 40 格，每格題數隨池大小調整
  list.forEach((q,i)=>{
    const r=S.records[q.id]; if(!r) return;
    done++;
    const c=Math.floor(i/per);
    if(r.correct===false){ hold++; cells[c]=2; }
    else { if(r.correct===null) pending++; else pass++;
           if(cells[c]!==2) cells[c]=1; }
  });
  // 顯示用：切成 4 層各 10 格，由下往上疊（第一層在最底）
  const tiers=[]; for(let r=0;r<4;r++) tiers.push(cells.slice(r*10,(r+1)*10));
  tiers.reverse();
  return {total:list.length, done, hold, pending, pass, cells:tiers.flat()};
}
/* 每日配額。固定值不會補課：停一個月之後未看的題會堆積，20 題/天就來不及。
   加量的理由是「初見一輪要在複習期開始前跑完」，不是「考前塞題記得比較牢」——
   後者在長期保留上其實是最差的做法。 */
function dailyGoal(){
  if(!S.goalAuto) return S.goal || 20;
  const d = daysLeft();
  if(d == null) return S.goal || 20;
  const unseen = pool().filter(q=>!S.records[q.id]).length;
  if(d > 240){                                   // 初見一輪要在剩 240 天前跑完
    const runway = Math.max(1, d - 240);
    return Math.min(40, Math.max(20, Math.ceil(unseen / runway)));
  }
  if(d > 60) return 20;                          // 複習期：交給間隔複習，配額不必大
  if(d > 14) return 30;
  return 40;                                     // 最後兩週：一天一份考卷的量
}

function heldQuestions(){ return pool().filter(q=>{ const r=S.records[q.id]; return r && r.correct===false; }); }
function totalScore(){
  let n=0;
  for(const id in S.records){ const r=S.records[id]; if(r.correct===true || (!HAS_KEY && r.correct===null)) n++; }
  return n;
}
function rankOf(n){
  let i=0; for(let k=0;k<RANKS.length;k++) if(n>=RANKS[k].at) i=k;
  return {i, cur:RANKS[i], next:RANKS[i+1]||null};
}
function daysLeft(){
  if(!S.examDate) return null;
  return Math.ceil((new Date(S.examDate+'T00:00:00') - new Date(today()+'T00:00:00'))/864e5);
}

function mascotSVG(key, mood, ctx){
  // 使用者放了自己的圖就用它。圖不會跟著塗裝色反白，所以在色場上加一圈底
  if(PICS[key]){
    const cls = ['m-pic'];
    if(ctx==='onLivery') cls.push('on-livery');
    if(S.picPlate!==false) cls.push('plate');
    if(!PICS[key].t) cls.push('fill');        // 沒去背的原圖：填滿圓盤，不留白邊
    return `<div data-mood="${mood||'idle'}" class="${cls.join(' ')}"
      role="img" aria-label="${esc(MASCOTS[key].name)}"><i style="background-image:url('${picSrc(key)}')"></i></div>`;
  }
  const m=MASCOTS[key];
  // onLivery：站在塗裝色場上 → 身體反白，細節用塗裝色挖空
  // onYard  ：站在堆場地面上 → 身體用 -lit 色，細節用地面色挖空
  const [c,on] = ctx==='onLivery'
    ? [`var(--${key}-on)`, `var(--${key})`]
    : [`var(--${key}-lit)`, `var(--yard)`];
  return `<div data-mood="${mood||'idle'}" style="width:100%;height:100%">${m.svg(c,on)}</div>`;
}

addEventListener('keydown', e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.target.closest && e.target.closest('input,textarea,select')) return;
  const opts=[...document.querySelectorAll('.opt')];
  const locked=$('#opts') && $('#opts').classList.contains('locked');
  if(opts.length && !locked){
    const k=e.key.toLowerCase();
    let i='abcd'.indexOf(k);
    if(i<0) i='1234'.indexOf(k);
    if(i>=0){ e.preventDefault(); opts[i].click(); return; }
  }
  if(e.key==='Enter'||e.key===' '){
    const sub=$('#submit'), nx=$('#next');
    if(sub && !sub.disabled){ e.preventDefault(); sub.click(); }
    else if(nx){ e.preventDefault(); nx.click(); }
    return;
  }
  if(e.key==='ArrowRight'){ const nx=$('#next'); if(nx){ e.preventDefault(); nx.click(); } return; }
  if(e.key==='Escape'){ const b=$('#quit')||$('#back'); if(b){ e.preventDefault(); b.click(); } }
});
